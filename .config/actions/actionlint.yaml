# actionlint configuration.
# Read by: actionlint, via an explicit -config-file path. actionlint's own
# default location is .github/actionlint.yaml; this repo overrides it so every
# tool config sits in one place.
# Docs: https://github.com/rhysd/actionlint/blob/main/docs/config.md

# Labels for self-hosted runners, if any are ever added. GitHub-hosted labels
# (ubuntu-24.04, ubuntu-slim, etc.) are known to actionlint and need no declaration.
self-hosted-runner:
  labels: []

# Every `vars.*` a workflow reads; actionlint rejects any other. Add a name
# here when a workflow first needs it.
config-variables:
  # The release App's client ID, an organization variable (decision 0017). A
  # client ID is not a secret; its private key is RELEASE_APP_PRIVATE_KEY.
  - RELEASE_APP_CLIENT_ID
