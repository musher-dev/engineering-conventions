# committed: the commit-message rules for every commit and pull request title
# (EC-0035, COMMIT-01). This file is the one list of types and scopes.
#
# Read by:
#   - .config/lefthook.yml                          (commit-msg)
#   - .github/workflows/validate-pull-request.yml   (Validate Pull Request / Title)
#   - release-please, indirectly: the type decides the version bump. Choose it
#     from docs/decisions/0005-status-severity-and-versioning.md#change-classification
#
# Keys: https://github.com/crate-ci/committed/blob/main/docs/reference.md

style = "conventional"
subject_length = 72
# The body wraps as its author chooses; only the header has a limit.
line_length = 0
subject_capitalized = false
subject_not_punctuated = true
imperative_subject = true
# fixup! commits are squashed by `git rebase --autosquash` before a merge.
no_fixup = false
no_wip = true

allowed_types = [
  "feat",
  "fix",
  "perf",
  "docs",
  "chore",
  "refactor",
  "test",
  "ci",
  "build",
  "style",
]

# One scope per part of the product, plus the repository machinery.
allowed_scopes = [
  "adr", # docs/decisions/**
  "checks", # engineering-conventions/checks/rego/**, the conftest checks
  "ci", # .github/workflows/**, .github/actions/**
  "cli", # engineering-conventions/src/**, the authoring CLI
  "conventions", # engineering-conventions/definitions/conventions/**, the requirements
  "deps", # Dependabot
  "deps-dev", # Dependabot, for dev-dependencies
  "docs", # docs/** other than decisions, READMEs
  "profiles", # engineering-conventions/definitions/profiles/**
  "release", # release-please pull requests
  "repo", # Taskfile, lefthook, .config/, .claude/, .devcontainer/
  "schemas", # engineering-conventions/checks/schemas/**
  "terminology", # engineering-conventions/definitions/terminology/**
  "vale", # the MusherConventions style and its generation
]
