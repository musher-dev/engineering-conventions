# Lefthook — Git hook configuration.
# Docs: https://lefthook.dev
#
# Location: this file lives in .config/, not the repo root. Lefthook
# discovers it natively — `MainConfigNames` in internal/config/loader.go is
# ["lefthook", ".lefthook", ".config/lefthook"] — so no flag, env var or
# wrapper is involved.
#
# Search order is first-match-wins: a stray root lefthook.yml would silently
# shadow this file.
#
# Local overrides: .config/lefthook-local.yml (gitignored) is auto-merged.
# Debug: lefthook run pre-commit | lefthook dump | lefthook validate
#
# Every job calls the same tool, with the same explicit config path, as the
# task named in its fail_text; CI runs those tasks. The hooks are the early
# copy of the gate, never a different gate.

assert_lefthook_installed: true

# Lockstep with "aqua:evilmartians/lefthook" in .config/mise/config.toml
# (.claude/rules/toolchain-pins.md).
min_version: "2.1.14"

# doublestar makes ** match 0+ directory levels (the intuitive semantics).
glob_matcher: doublestar

output:
  - meta
  - summary
  - failure
  - execution_out
  - skips

pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  jobs:
    - name: gitleaks
      # No glob: a secret can land in any file type.
      run: gitleaks git --pre-commit --staged --redact --no-banner --config .config/security/gitleaks.toml
      fail_text: >-
        A staged change looks like a secret. Remove it from the commit; never
        allowlist a real one. Full scan: 'task secrets:scan'.

    - name: markdown
      glob: "**/*.md"
      # Same exclusions, and reasons, as MD_PATHSPEC in taskfiles/lint.Taskfile.yml.
      exclude:
        - "CHANGELOG.md"
        - ".github/pull_request_template.md"
        - "engineering-conventions/tests/fixtures/**"
      run: markdownlint-cli2 --config .config/markdown/markdownlint.jsonc --fix {staged_files}
      stage_fixed: true
      fail_text: "Markdown lint failed on what --fix cannot repair. Run 'task lint:md' for the report."

    - name: yaml
      glob: "**/*.{yml,yaml}"
      # Same exclusion, and reason, as YAML_PATHSPEC in taskfiles/lint.Taskfile.yml.
      exclude:
        - "engineering-conventions/tests/fixtures/**"
      run: yamllint -c .config/yaml/yamllint.yaml --strict {staged_files}
      fail_text: "YAML lint failed. Run 'task lint:yaml'; the rules are in .config/yaml/yamllint.yaml."

    - name: toml
      glob: "**/*.toml"
      # Same exclusion, and reason, as TOML_PATHSPEC in taskfiles/lint.Taskfile.yml.
      exclude:
        - "engineering-conventions/tests/fixtures/**"
      run: taplo fmt --config .config/toml/taplo.toml {staged_files}
      stage_fixed: true
      fail_text: "taplo could not format a staged TOML file (a parse error). Run 'task lint:toml'."

    - name: spelling
      # No glob: a typo can land in any file type. --force-exclude makes the
      # config's excludes hold for files passed by name.
      run: typos --config .config/spelling/typos.toml --force-exclude {staged_files}
      fail_text: >-
        Spelling check failed. Fix the word, or add a reasoned entry to
        .config/spelling/typos.toml. Run 'task lint:spelling'.

    - name: shell
      glob:
        - "**/*.sh"
        - "engineering-conventions/bin/*"
      # report.jq is the launcher's jq program, not a shell script.
      exclude:
        - "engineering-conventions/bin/*.jq"
      run: shellcheck -x -P SCRIPTDIR {staged_files}
      fail_text: "ShellCheck failed. Run 'task lint:shell'."

    - name: actions
      # Whole-directory runs: actionlint and zizmor resolve composite actions
      # and reusable workflows across files, so a staged-file subset misses
      # the cross-file findings.
      glob: ".github/**/*.{yml,yaml}"
      run: task lint:actions lint:actions:security
      fail_text: "Workflow lint failed. Run 'task lint:actions lint:actions:security'."

    - name: rego-fmt
      glob: "**/*.rego"
      run: opa fmt --write {staged_files}
      stage_fixed: true
      fail_text: "opa fmt could not format a staged Rego file (a parse error). Run 'task checks:fmt:check'."

    - name: rego-lint
      glob: "**/*.rego"
      run: task checks:lint checks:check
      fail_text: "Rego lint or type-check failed. Run 'task checks:lint checks:check'."

    # The content schemas run as a whole, through the task: their files go
    # through yq first, which a staged-file list cannot reproduce.
    - name: schemas
      glob:
        - "engineering-conventions/checks/schemas/*.json"
        - "engineering-conventions/definitions/terminology/**/*.yml"
        - "engineering-conventions/definitions/profiles/*.yml"
        - "engineering-conventions/definitions/conventions/**/*.{md,yml}"
        - "docs/decisions/*.md"
        - ".repo/*.toml"
      run: task schemas:check schemas:validate
      fail_text: "Schema validation failed. Run 'task schemas:check schemas:validate'."

    # GitHub and Task configuration is checked against check-jsonschema's
    # built-in schemas, file by file, so these run on the staged files only:
    # the same tool and schema as the matching step of `task schemas:validate`.
    - name: workflow-schemas
      glob: ".github/workflows/*.{yml,yaml}"
      run: >-
        check-jsonschema --builtin-schema vendor.github-workflows {staged_files} &&
        check-jsonschema --builtin-schema custom.github-workflows-require-timeout {staged_files}
      fail_text: "A workflow fails its schema. Run 'task schemas:validate'."

    - name: action-schemas
      glob: ".github/actions/*/action.{yml,yaml}"
      run: check-jsonschema --builtin-schema vendor.github-actions {staged_files}
      fail_text: "A composite action fails its schema. Run 'task schemas:validate'."

    - name: dependabot-schema
      glob: ".github/dependabot.yml"
      run: check-jsonschema --builtin-schema vendor.dependabot {staged_files}
      fail_text: "The Dependabot config fails its schema. Run 'task schemas:validate'."

    - name: issue-form-schemas
      glob: ".github/ISSUE_TEMPLATE/*.yml"
      exclude:
        - ".github/ISSUE_TEMPLATE/config.yml"
      run: check-jsonschema --builtin-schema vendor.github-issue-forms {staged_files}
      fail_text: "An issue form fails its schema. Run 'task schemas:validate'."

    - name: issue-config-schema
      glob: ".github/ISSUE_TEMPLATE/config.yml"
      run: check-jsonschema --builtin-schema vendor.github-issue-config {staged_files}
      fail_text: "The issue template config fails its schema. Run 'task schemas:validate'."

    - name: taskfile-schemas
      glob:
        - "Taskfile.yml"
        - "taskfiles/*.yml"
      run: check-jsonschema --builtin-schema vendor.taskfile {staged_files}
      fail_text: "A Taskfile fails its schema. Run 'task schemas:validate'."

    - name: generate
      # The generated files are outputs, never staged inputs, so stage_fixed
      # (which restages only the files lefthook passed in) cannot reach them;
      # they are added by name instead. `task generate:check` in CI catches
      # a commit made with --no-verify.
      glob:
        - "engineering-conventions/definitions/conventions/**/*.{md,yml}"
        - "engineering-conventions/definitions/terminology/**/*.yml"
        - "engineering-conventions/definitions/profiles/*.yml"
        - "engineering-conventions/src/**/*.py"
      exclude:
        - "engineering-conventions/definitions/conventions/README.md"
      run: >-
        task generate &&
        git add engineering-conventions/checks/data/index.json
        engineering-conventions/checks/vale
        engineering-conventions/definitions/conventions/README.md
      fail_text: "Regenerating the committed artifacts failed. Run 'task generate' for the error."

    - name: prose
      glob:
        - "README.md"
        - "CONTRIBUTING.md"
        - "SECURITY.md"
        - "AGENTS.md"
        - "docs/**/*.md"
        - "engineering-conventions/definitions/conventions/**/*.md"
      run: vale --config .config/markdown/vale.ini {staged_files}
      fail_text: "Prose lint failed against the MusherConventions style. Run 'task prose:lint'."

# A merge commit's generated message is not a Conventional Commit, and a
# rebase replays messages already checked (COMMIT-03).
commit-msg:
  skip:
    - merge
    - rebase
  jobs:
    - name: committed
      run: committed --config .config/commits/committed.toml --commit-file {1}
      fail_text: >-
        The message must be a Conventional Commit, type(scope): summary, with a
        type and scope from .config/commits/committed.toml, an imperative
        subject and a header of at most 72 columns.

pre-push:
  parallel: true
  jobs:
    - name: checks-test
      run: task checks:test
      fail_text: "Rego unit tests or coverage failed. Run 'task checks:test'."

    - name: cli-test
      run: task cli:test
      fail_text: "The conventions CLI tests (fixtures and invariants included) failed. Run 'task cli:test'."

    - name: conventions
      run: task conventions:self
      fail_text: >-
        This repository no longer passes its own conventions (warnings count).
        Run 'task conventions:self' for the findings.
