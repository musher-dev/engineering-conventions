# Vale configuration: the prose rules this repository publishes, run against
# its own prose (`task prose:lint`).
# Read by: vale, via an explicit --config path. Never auto-discovered.
# Docs: https://vale.sh/docs/topics/config
#
# StylesPath is relative to this file. It points at the generated style
# (`task generate` writes it from terminology/), so this repo is checked by
# exactly the package consumers download, never by a hand-kept copy.
StylesPath = ../../engineering-conventions/checks/vale

MinAlertLevel = suggestion

# Only MusherConventions: typos owns spelling (.config/spelling/typos.toml), so
# Vale's built-in Vale.Spelling is deliberately not enabled; two spellcheckers
# would disagree on every product name.
[*.md]
BasedOnStyles = MusherConventions
