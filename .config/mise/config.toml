# The single anchor for every CLI this repository runs: the dev container,
# `task setup` and CI all install from this file (docs/repository.md →
# "Toolchain"). mise discovers it natively at .config/mise/config.toml, so no
# environment variable points at it.
#
# Edit a version here, then `task tools:lock` and `task tools:install`.
# mise.lock beside this file records each tool's download URL and checksum per
# platform, and every install runs with --locked. Lockstep pins that cannot be
# expressed here are listed in .claude/rules/toolchain-pins.md.
#
# Backends are fully qualified so resolution does not depend on mise's registry.

# Lockstep with ARG MISE_VERSION in .devcontainer/Dockerfile and the version
# of jdx/mise-action in .github/actions/setup-tools/action.yml.
min_version = "2026.9.12"

[tools]
# --- Runtimes ------------------------------------------------------------
# Node exists only to run markdownlint-cli2.
node = "24.21.0"
# Python exists so `mise install --locked` can replay the pipx tools' uv.lock
# files, which needs an interpreter mise manages. uv reads the same version
# from engineering-conventions/.python-version (TOOL-11).
python = "3.13.15"
"aqua:astral-sh/uv" = "0.12.18"

# --- Task runner + git hooks ---------------------------------------------
"aqua:go-task/task" = "3.53.1"
# Keep in lockstep with min_version in .config/lefthook.yml.
"aqua:evilmartians/lefthook" = "2.1.14"
# Lints commit messages and pull request titles against
# .config/commits/committed.toml (COMMIT, EC-0035). The github: backend,
# because aqua's registry entry has no linux/arm64 asset.
"github:crate-ci/committed" = "1.1.11"

# --- Rule engines ----------------------------------------------------------
"aqua:open-policy-agent/conftest" = "0.70.1"
# Lockstep with the OPA version conftest 0.70.1 embeds, so `opa test` and
# `conftest test` evaluate the same language.
"aqua:open-policy-agent/opa" = "1.20.2"
"aqua:open-policy-agent/regal" = "0.42.0"
"aqua:vale-cli/vale" = "3.22.0"
"pipx:check-jsonschema" = "0.38.1"
# The OpenAPI ruleset's engine (OAS-01, decision 0023): the launcher's
# `conventions openapi` runs it, and `task checks:openapi` tests the shipped
# ruleset with it. Lockstep with SPECTRAL_VERSION in bin/conventions.
"aqua:stoplightio/spectral" = "6.16.3"

# --- Linters (configs live in .config/; see docs/repository.md) -----------
"npm:markdownlint-cli2" = "0.23.3"
"pipx:yamllint" = "1.38.0"
"aqua:tamasfe/taplo" = "0.10.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"
"aqua:crate-ci/typos" = "1.50.2"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:koalaman/shellcheck" = "0.11.0"
# Dockerfile lint (IMAGE-06, EC-0040): `task lint:docker` and the pre-commit
# hook run it on .devcontainer/Dockerfile. Lockstep with HADOLINT_VERSION in
# bin/conventions.
"aqua:hadolint/hadolint" = "2.15.1"

# --- Plumbing --------------------------------------------------------------
"aqua:mikefarah/yq" = "4.53.6"
"aqua:jqlang/jq" = "1.8.2"

[settings]
# pipx tools install through uv rather than a system pipx.
pipx.uvx = true
