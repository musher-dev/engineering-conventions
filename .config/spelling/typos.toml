# typos configuration: the spellchecker for every tracked file.
# Read by: typos, via an explicit --config path (`task lint:spelling`, and the
# lefthook `spelling` job with --force-exclude so the excludes below hold when
# lefthook passes an excluded file by name).
# Docs: https://github.com/crate-ci/typos/blob/master/docs/reference.md

[default]
# SCREAMING_SNAKE identifiers (env vars, secret names) are names, not words.
extend-ignore-identifiers-re = ["[A-Z]{2,}_[A-Z0-9_]+"]

[default.extend-words]
musher = "musher"
# Both spellings are standard; this one is the usual one in programming prose.
unparseable = "unparseable"

[files]
extend-exclude = [
  # Written by release-please from merged commit subjects: a typo there is
  # immutable history, and flagging it reds the release PR, which no commit
  # to that branch can fix.
  "CHANGELOG.md",
  # Generated by `task generate` from definitions/terminology/. A misspelling is fixed
  # at the source, which this scan already covers.
  "engineering-conventions/checks/vale/**",
  # Also generated, from definitions/ and the vendored schemas below; it
  # carries their text and nothing of its own.
  "engineering-conventions/checks/data/index.json",
  # Third-party schemas kept byte-identical to SchemaStore's: their language
  # names (byond, edn, routeros) are names, and a real typo is fixed upstream.
  "engineering-conventions/checks/schemas/vendor/**/*.json",
  # The terminology lists banned and discouraged spellings on purpose: an
  # alias is recorded precisely because people write it.
  "engineering-conventions/definitions/terminology/**",
  # The copy rules are regular expressions over word stems (empower(?:ment)?,
  # supercharg(?:e|ing)), which are not words a spellchecker can read.
  "engineering-conventions/definitions/copy/style.yml",
  # Fixture repos and invalid-input fixtures carry deliberate mistakes that
  # the checks under test must catch.
  "engineering-conventions/tests/fixtures/**",
  # Machine-written lockfile: package names and hashes, not prose.
  "engineering-conventions/uv.lock",
  # Written by `mise lock` (`task tools:lock`): package names, URLs and hashes
  # of the pinned tools and their dependencies, not prose.
  ".config/mise/mise.lock",
  ".config/mise/locks/**",
  "engineering-conventions/examples/consumer/.config/mise/mise.lock",
  "engineering-conventions/examples/staged-consumer/.config/mise/mise.lock",
  "dist/**",
]
