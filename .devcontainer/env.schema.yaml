# =============================================================================
# Dev container — environment schema.
#
# The source of truth for every variable the *dev environment* reads:
# `.devcontainer/.env.example` is rendered from this file (`task env:render`),
# and `repo env check` fails when the two disagree. A product's own runtime
# contract is a separate schema at <product>/env.schema.yaml — LAYOUT.md
# explains the split.
#
# `consumers:` names the stacks that read a binding, so `repo env doctor` only
# demands a value for stacks the enabled COMPOSE_PROFILES actually start.
# =============================================================================
service: devcontainer
runtime: docker-compose
env_file: .devcontainer/.env

bindings:
  COMPOSE_PROFILES:
    type: list
    values: [redis, minio, registry, azimutt, observability]
    local_default: ""
    sensitivity: public
    group: Service Profiles
    description: >-
      Comma-separated list of optional stacks to start. Empty means only the
      always-on stacks (postgres). `task env:setup` offers these as a menu.

  POSTGRES_USER:
    type: string
    local_default: postgres
    sensitivity: internal
    consumers: [postgres, azimutt]
    group: PostgreSQL
    description: Superuser the always-on Postgres stack is initialised with.

  POSTGRES_PASSWORD:
    type: string
    local_default: postgres
    sensitivity: internal
    consumers: [postgres, azimutt]
    group: PostgreSQL
    description: Dev-only password for POSTGRES_USER. Never a real credential.

  POSTGRES_DB:
    type: string
    local_default: app
    sensitivity: internal
    consumers: [postgres, azimutt]
    group: PostgreSQL
    description: Database created on first start of the Postgres stack.

  MINIO_ROOT_USER:
    type: string
    local_default: minioadmin
    sensitivity: internal
    consumers: [minio]
    group: MinIO (project S3 storage)
    description: Root user of the project MinIO stack.

  MINIO_ROOT_PASSWORD:
    type: string
    local_default: minioadmin
    sensitivity: internal
    consumers: [minio]
    group: MinIO (project S3 storage)
    description: Root password of the project MinIO stack. Dev-only.

  MINIO_OBS_ROOT_USER:
    type: string
    local_default: minioadmin
    sensitivity: internal
    consumers: [observability]
    mirrored_in:
      - stacks/observability/config/tempo-config.yaml
      - stacks/observability/config/loki-config.yaml
    group: MinIO (observability stack)
    description: >-
      Root user of the MinIO instance Tempo and Loki store blocks in. Those two
      configs are native YAML with no env interpolation, so they carry the value
      literally; `mirrored_in` is what keeps them in step (ENV-05).

  MINIO_OBS_ROOT_PASSWORD:
    type: string
    local_default: minioadmin
    sensitivity: internal
    consumers: [observability]
    mirrored_in:
      - stacks/observability/config/tempo-config.yaml
      - stacks/observability/config/loki-config.yaml
    group: MinIO (observability stack)
    description: Root password for that MinIO instance, mirrored the same way.
