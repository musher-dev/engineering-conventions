name: Setup Tools
description: >-
  Install the CLIs pinned in .devcontainer/mise.toml, so a job runs the same
  tool versions as the dev container and a local `task` run.

inputs:
  install-args:
    description: >-
      Space-separated subset of tools to install, each spelled exactly as its
      key in .devcontainer/mise.toml (e.g. "aqua:go-task/task node"). A short
      registry name such as "uv" resolves to a different, unpinned tool.
      Empty installs every pinned tool.
    required: false
    default: ""
  cache:
    description: >-
      "true" to restore and save the mise tool cache. Pass "false" from any job
      that produces a release artifact, so a poisoned cache cannot reach it.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # mise-action only exports these to its own step, but every later step
    # resolves tools through mise shims, which need them too. The manifest lives
    # under .devcontainer/, not the repo root: without MISE_GLOBAL_CONFIG_FILE
    # mise finds no config, installs nothing, and a job whose task is missing a
    # tool can still go green.
    - name: Point mise at the repository's tool manifest
      shell: bash
      run: |
        {
          echo "MISE_GLOBAL_CONFIG_FILE=${GITHUB_WORKSPACE}/.devcontainer/mise.toml"
          echo "MISE_TRUSTED_CONFIG_PATHS=${GITHUB_WORKSPACE}"
        } >> "$GITHUB_ENV"

    - name: Install the pinned tools
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      with:
        # Lockstep with ARG MISE_VERSION in .devcontainer/Dockerfile.
        version: 2026.9.12
        install: true
        install_args: ${{ inputs.install-args }}
        cache: ${{ inputs.cache }}
