# Dependabot: weekly, grouped, with a cooldown, and with commit messages that
# pass this repo's own PR-title check (.config/commits/committed.toml).
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# `include: scope` turns each prefix into `<type>(deps)`, or `<type>(deps-dev)`
# for a development dependency, so no Dependabot PR needs a hand-edited title.
#
# The CLI pins in .config/mise/config.toml have no Dependabot ecosystem; bump
# them by hand, with the lockstep pins in .claude/rules/toolchain-pins.md.
version: 2
updates:
  # SHA pins in the workflows, plus the one composite action that installs
  # the toolchain (Dependabot does not look inside .github/actions/ by itself),
  # and the example consumers' workflows, which consumers copy pins from.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-tools"
      - "/engineering-conventions/examples/consumer"
      - "/engineering-conventions/examples/staged-consumer"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Etc/UTC"
    # Seven days for a release to be yanked or flagged before it reaches CI.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: "scope"

  # Features in devcontainer.json, and the digests in devcontainer-lock.json.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    groups:
      devcontainers:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The digest of the dev container's base image, in .devcontainer/Dockerfile.
  # Digest updates only: the Ubuntu LTS tag moves by hand, since the next
  # version Dependabot sees may be an interim release.
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "mcr.microsoft.com/devcontainers/base"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # The authoring CLI's uv.lock. It lives in the product directory, never
  # "/" (docs/repository.md).
  - package-ecosystem: "uv"
    directory: "/engineering-conventions"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
