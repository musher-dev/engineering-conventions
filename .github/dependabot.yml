# Dependabot keeps the dev container supply chain fresh.
# Docs: https://containers.dev/guide/dependabot
#
# - devcontainers  : bumps Features in devcontainer.json AND refreshes
#                    .devcontainer/devcontainer-lock.json (digest pins).
# - github-actions : bumps the actions pinned in .github/workflows/.
# - docker         : bumps the image tags in the compose files.
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "devcontainer"

  # A product's own ecosystem (cargo, npm, uv, gomod ...) scans the product
  # directory, never "/" -- LAYOUT-08. See LAYOUT.md → "Ecosystem Adapters".
  # - package-ecosystem: "cargo"
  #   directory: "/<product>"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Docker images. /.devcontainer covers the Dockerfile's `FROM` base image;
  # /.devcontainer/stacks/** covers each stack's own standard-named compose.yaml
  # (pulled into stacks/compose.yaml via `include:`). The orchestrator itself
  # declares no images. If Dependabot does not surface PRs for a stack, verify
  # detection under Insights -> Dependency graph -> Dependabot and adjust these
  # directories.
  #
  # Note: this does NOT cover the tool pins in the Dockerfile's ARGs (bun, uv,
  # task, mise) -- Dependabot has no ecosystem for those. Bump them by hand;
  # `repo toolchain check` keeps them exact and in step with CI.
  - package-ecosystem: "docker"
    directories:
      - "/.devcontainer"
      - "/.devcontainer/stacks/**"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
