name: Release

# Owns the release pull request, the release tag and the release itself
# (decision 0017). release-please keeps one open pull request on main that
# bumps version.txt and CHANGELOG.md; a human merges it, and the next run here
# creates the `vX.Y.Z` tag and a draft GitHub Release. The Bundle job builds
# the conventions bundle from that tag with read-only permissions; the Attest
# job, which runs no repository code, verifies, attests and attaches it to the
# draft; Finalize then publishes the draft, which from that moment is
# immutable. Nothing here merges anything. A maintainer reads a failure here:
# until it is fixed, no release pull request is opened or updated, or a draft
# release waits for its assets.
#
# A release left in draft (a failed Bundle, Attest or Finalize) is recovered
# with "Re-run failed jobs" on the original run, or, when the workflow itself
# had to be fixed first, by dispatching this workflow with the draft's tag. A
# dispatched run refuses a release that is already published.
#
# The jobs that mint the release App token run in the `release` environment,
# which holds the App's key and admits only main, so a workflow run from any
# other branch cannot read it.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of a draft release to attach the bundle to and publish, such as v1.2.3.
        required: true
        type: string

# Every job states what it needs; the release App's token makes the writes that
# must start other workflows or bypass the tag ruleset.
permissions: {}

# Queued, never cancelled: a run cancelled between creating a tag and
# publishing its release leaves a draft to recover by hand.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_please:
    name: Release PR and Tags
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The release App's token, not the default token: GitHub starts no
      # workflow for an event the default token raises, so a release pull
      # request opened with it would never report its required contexts. The
      # App is also the only actor the Release Tags ruleset lets create a `v*`
      # tag. The installation token is scoped down at mint time, expires within
      # the hour and is revoked in the post step.
      - name: Mint the release App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # The config drafts each release and creates its tag with it
      # (`draft`, `force-tag-creation`), so the Attest job can attach assets
      # before anything is published.
      - name: Open or update the release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ steps.app_token.outputs.token }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  # Runs the repository's code at the tag, so it gets no write access: it
  # hands the built assets to the Attest job as a workflow artifact.
  bundle:
    name: Bundle
    needs: release_please
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch'
      || needs.release_please.outputs.release_created == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read  # check out the tag
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release_please.outputs.tag_name }}
    steps:
      - name: Check the tag is a release version
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not a release version (vX.Y.Z)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: ./.github/actions/setup-tools
        with:
          install-args: >-
            aqua:go-task/task aqua:astral-sh/uv aqua:open-policy-agent/conftest
            aqua:open-policy-agent/opa aqua:vale-cli/vale aqua:jqlang/jq
          cache: "false"

      - name: Check the bundle version matches the tag
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version.txt)"
          if [[ "$version" != "${TAG#v}" ]]; then
            echo "::error::version.txt says '$version' but the tag is '$TAG'"
            exit 1
          fi

      - name: Build the release bundle and verify it
        run: task bundle:build bundle:verify

      # Kept long enough for "Re-run failed jobs" on Attest or Finalize.
      - name: Hand the release assets to the Attest job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Holds the write, signing and attestation permissions, so it runs no
  # repository code: no checkout, no task, nothing from the Bundle job but the
  # files it built, checked against the SHA256SUMS built with them.
  attest:
    name: Attest and Upload
    needs: [release_please, bundle]
    if: ${{ !cancelled() && needs.bundle.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # upload the release assets to the draft
      id-token: write  # sign the provenance attestation
      attestations: write  # store the provenance attestation
      artifact-metadata: write  # record the attested artifacts
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release_please.outputs.tag_name }}
    steps:
      # A published release is immutable: its assets cannot change, so a
      # dispatched run only ever completes a draft. Here rather than in Bundle,
      # because a token without contents: write cannot see a draft release.
      - name: Check the release is still a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$draft" != "true" ]]; then
            echo "::error::release $TAG is not a draft; a published release cannot change"
            exit 1
          fi

      - name: Download the release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Check the assets against their checksums
        run: (cd dist && sha256sum --check --strict SHA256SUMS)

      # One attestation over every file SHA256SUMS lists: the bundle, the Vale
      # package and the manifest.
      - name: Attest the release assets' build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # No --clobber: an asset already on the draft is never replaced, so a
      # retry after a partial upload fails loudly rather than swapping bytes.
      - name: Upload the assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"

      - name: Summarise the release assets
        run: |
          set -euo pipefail
          {
            echo "## Assets for $TAG"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  finalize:
    name: Publish Release
    needs: [release_please, attest]
    if: ${{ !cancelled() && needs.attest.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release_please.outputs.tag_name }}
    steps:
      # The release App publishes, not the default token: a release the
      # default token publishes starts no workflow on its `published` event.
      - name: Mint the release App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      # Immutable releases are a repository setting no file records. Checking
      # the published release is how a run proves it is on.
      - name: Check the published release is immutable
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .immutable)"
          if [[ "$immutable" != "true" ]]; then
            echo "::error::release $TAG was published but is not immutable; enable immutable releases"
            exit 1
          fi
