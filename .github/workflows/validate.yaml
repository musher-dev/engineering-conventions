name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -x --source-path=SCRIPTDIR
        with:
          scandir: .devcontainer/scripts

  compose:
    name: Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose config
        run: |
          cp .devcontainer/.env.example .devcontainer/.env
          # --env-file is mandatory, not decorative: the orchestrator lives under
          # stacks/ and is no longer a sibling of .env, so Compose's positional
          # auto-discovery would silently fall back to ${VAR:-default}.
          docker compose --env-file .devcontainer/.env \
            -f .devcontainer/stacks/compose.yaml config --quiet
      - name: Validate compose config with every profile enabled
        run: |
          # `config` respects profiles, so the run above only covers the always-on
          # stacks. Enable all of them so an opt-in stack cannot rot unnoticed --
          # and so a broken --env-file surfaces here rather than at someone's
          # first `Reopen in Container`.
          COMPOSE_PROFILES=redis,minio,registry,azimutt,observability \
            docker compose --env-file .devcontainer/.env \
              -f .devcontainer/stacks/compose.yaml config --quiet
      - name: Reject floating image tags
        run: |
          # Fail on :latest / :main tags that are not digest-pinned (@sha256:...).
          if grep -rnE 'image:.*(:latest|:main)([[:space:]]|$)' \
               .devcontainer/stacks/; then
            echo "::error::Floating image tag found. Pin to a version or digest." >&2
            exit 1
          fi

  lockfile:
    name: Devcontainer Lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce devcontainer-lock.json is current
        # --frozen-lockfile fails if the committed lock is missing or its
        # resolved Feature digests drift from devcontainer.json.
        run: npx -y @devcontainers/cli build --workspace-folder . --frozen-lockfile

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Tool versions resolve from .devcontainer/mise.toml -- the same file the
    # container uses -- so CI and local can never drift.
    env:
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.devcontainer/mise.toml
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned lint tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          # Keep in lockstep with the go-task Feature pin in devcontainer.json.
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run every lint gate
        run: task lint:all

  governance:
    name: Repo Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
      - name: Install the repo governance CLI
        run: uv tool install ./.repo
      - name: Check repo structure policies
        run: repo check
      - name: Test the policies
        # Most layout rules only fire once a product is declared, which the
        # template never does -- the suite is what keeps them honest.
        run: uv run --project .repo --group dev pytest .repo/tests

  build:
    name: Devcontainer Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build devcontainer
        uses: devcontainers/ci@v0.3
        with:
          # Asserts the Dockerfile-baked tools report their pinned versions --
          # the runtime half of the split the Dockerfile's presence-only
          # `test -x` assertions leave open.
          runCmd: bash .devcontainer/scripts/verify-toolchain.sh
