name: Validate

# Owns the judgement of every change to this repository: its own hygiene, the
# checks it ships (Rego, schemas, the conventions CLI), the content those checks
# are generated from, the release bundle, and whether this repository follows
# its own conventions. The pull request author reads a red job here; the one
# context branch protection requires is `Validate / Required`, which fails
# unless every other job succeeded or skipped as `detect` planned.
#
# Each job runs `task` targets rather than tool commands, so a failure
# reproduces locally with the same command the job ran.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs this change needs. Only the dev container job is scoped:
  # it is the slowest job and proves only the files it builds from. Every other
  # job runs on every change. A push to main or a merge-group run always builds
  # it, so the default branch is proved in full whatever the pull request diff
  # said.
  #
  # It also names the jobs a verified earlier run already passed on identical
  # inputs (decision 0040). Off unless the repository variable CI_PASS_MARKERS
  # is `on`, and only on a same-repository pull request: a push to main, a
  # merge-group run and a fork's run read no markers and run every job.
  detect:
    name: Detect Changes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # to list the ci-pass- caches and read the runs they name
    outputs:
      devcontainer: ${{ steps.scope.outputs.devcontainer }}
      # A JSON array of job IDs; `[]` when the step is off or proves nothing.
      passed_jobs: ${{ steps.markers.outputs.passed_jobs || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The pull request's base commit must be in the clone to diff against.
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the dev container needs building
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "devcontainer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Three dots: what the pull request changed since it left its base,
          # not what landed on the base since.
          changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          printf '%s\n' "$changed"
          # What the image is built from, and the job that builds it.
          inputs='^(\.devcontainer/|\.config/mise/|\.github/actions/setup-tools/'
          inputs+='|\.github/workflows/validate\.yml$)'
          if grep -qE "$inputs" <<<"$changed"; then
            echo "devcontainer=true" >> "$GITHUB_OUTPUT"
          else
            echo "devcontainer=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Find the jobs a verified run already passed on these inputs
        id: markers
        if: >-
          vars.CI_PASS_MARKERS == 'on'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          passed="$(bash .github/scripts/ci-pass.sh prove)"
          echo "passed_jobs=${passed}" >> "$GITHUB_OUTPUT"

  repository_lint:
    name: Repository / Lint
    needs: detect
    if: ${{ !contains(fromJSON(needs.detect.outputs.passed_jobs), 'repository_lint') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          install-args: >-
            aqua:go-task/task node npm:markdownlint-cli2 aqua:astral-sh/uv python
            pipx:yamllint aqua:tamasfe/taplo aqua:crate-ci/typos aqua:koalaman/shellcheck
            aqua:hadolint/hadolint
      - name: Lint Markdown, YAML, TOML, spelling, shell scripts and Dockerfiles
        run: task lint:md lint:yaml lint:toml lint:spelling lint:shell lint:docker

      # Last, so it runs only when every check above passed (decision 0040).
      - name: Record that this job passed on these inputs
        if: vars.CI_PASS_MARKERS == 'on'
        uses: ./.github/actions/sync-pass-marker

  repository_secrets:
    name: Repository / Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The scan covers history, not just the tip: a secret removed in a
          # later commit is still published.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          install-args: aqua:go-task/task aqua:gitleaks/gitleaks
      - name: Scan the history for secrets
        run: task secrets:scan

  # GitHub's own answer on whether every CODEOWNERS owner exists and has
  # write access (COMM-11, decision 0041). It changes when a team does, with
  # no file here changing, so this job never skips on a pass marker.
  codeowners:
    name: Repository / Code Owners
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          install-args: aqua:go-task/task aqua:jqlang/jq
      # The pull request's head commit, which GitHub has for a fork's pull
      # request too; on a push or merge-group run, the commit under test.
      - name: Ask GitHub whether every CODEOWNERS owner resolves
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: task conventions:codeowners REF="$REF"

  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          # shellcheck is here because actionlint lints `run:` scripts with it
          # when it is on PATH, and silently skips them when it is not.
          install-args: >-
            aqua:go-task/task aqua:rhysd/actionlint aqua:zizmorcore/zizmor
            aqua:koalaman/shellcheck
      - name: Lint the workflows and composite actions
        env:
          # zizmor's online audits (impostor commits, stale version comments,
          # known-vulnerable actions) query the GitHub API.
          GH_TOKEN: ${{ github.token }}
        run: task lint:actions lint:actions:security

  checks:
    name: Checks
    needs: detect
    if: ${{ !contains(fromJSON(needs.detect.outputs.passed_jobs), 'checks') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          install-args: >-
            aqua:go-task/task aqua:open-policy-agent/conftest
            aqua:open-policy-agent/opa aqua:open-policy-agent/regal
            aqua:stoplightio/spectral aqua:mikefarah/yq aqua:jqlang/jq
      - name: Check, lint and test the Rego rules and the OpenAPI ruleset
        run: task checks:fmt:check checks:lint checks:compile checks:test checks:openapi

      # Last, so it runs only when every check above passed (decision 0040).
      - name: Record that this job passed on these inputs
        if: vars.CI_PASS_MARKERS == 'on'
        uses: ./.github/actions/sync-pass-marker

  content:
    name: Content
    needs: detect
    if: ${{ !contains(fromJSON(needs.detect.outputs.passed_jobs), 'content') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          install-args: >-
            aqua:go-task/task aqua:astral-sh/uv python pipx:check-jsonschema
            aqua:mikefarah/yq aqua:vale-cli/vale
      - name: Validate schemas, generated files and prose
        env:
          # Generating needs the CLI, not its linters and test runner.
          UV_NO_DEV: "1"
        run: task schemas:check schemas:validate generate:check prose:lint

      # Last, so it runs only when every check above passed (decision 0040).
      - name: Record that this job passed on these inputs
        if: vars.CI_PASS_MARKERS == 'on'
        uses: ./.github/actions/sync-pass-marker

  cli:
    name: CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Full history so the invariants can read the published index.json at
      # the baseline commit and refuse a renumbered or dropped ID.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          # The test suite shells out to five of these: conftest (every
          # fixture repository runs through `conventions check`), vale (the
          # generated styles must load), check-jsonschema (the schemas'
          # relative $refs must resolve from disk), jq (the launcher tests
          # run bin/conventions on the tools on PATH) and spectral (they run
          # `conventions openapi` too). A pipx tool installs from the lockfile
          # only with the python mise pins, so python comes too.
          install-args: >-
            aqua:go-task/task aqua:astral-sh/uv python aqua:open-policy-agent/conftest
            aqua:vale-cli/vale pipx:check-jsonschema aqua:jqlang/jq aqua:stoplightio/spectral
      - name: Lint, type-check and test the conventions CLI
        run: task cli:lint cli:typecheck cli:test
      # The baseline is what the change builds on: the PR base, the merge
      # queue base, or the previous tip of main on push.
      - name: Check the content invariants against the baseline
        env:
          BASELINE: >-
            ${{ github.event.pull_request.base.sha
            || github.event.merge_group.base_sha
            || github.event.before }}
        run: task cli:invariants BASELINE="$BASELINE"

  conventions:
    name: Conventions / Self
    needs: detect
    if: ${{ !contains(fromJSON(needs.detect.outputs.passed_jobs), 'conventions') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          install-args: >-
            aqua:go-task/task aqua:astral-sh/uv aqua:open-policy-agent/conftest
      - name: Check this repository against its own conventions
        env:
          # The check needs the CLI, not its linters and test runner.
          UV_NO_DEV: "1"
        run: task conventions:self

      # Last, so it runs only when every check above passed (decision 0040).
      - name: Record that this job passed on these inputs
        if: vars.CI_PASS_MARKERS == 'on'
        uses: ./.github/actions/sync-pass-marker

  bundle:
    name: Bundle
    needs: detect
    if: ${{ !contains(fromJSON(needs.detect.outputs.passed_jobs), 'bundle') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          install-args: >-
            aqua:go-task/task aqua:astral-sh/uv aqua:open-policy-agent/conftest
            aqua:open-policy-agent/opa aqua:vale-cli/vale aqua:jqlang/jq
      - name: Build the release bundle and verify it
        run: task bundle:build bundle:verify

      # Last, so it runs only when every check above passed (decision 0040).
      - name: Record that this job passed on these inputs
        if: vars.CI_PASS_MARKERS == 'on'
        uses: ./.github/actions/sync-pass-marker

  devcontainer:
    name: Dev Container
    needs: detect
    if: needs.detect.outputs.devcontainer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          install-args: node
      # The Dev Containers CLI is one of the two tools installed outside mise
      # (docs/repository.md, "Toolchain"); its three uses move together.
      # --frozen-lockfile fails when devcontainer-lock.json is missing or its
      # Feature digests have drifted from devcontainer.json.
      - name: Build the dev container image
        run: npx -y @devcontainers/cli@0.89.0 build --workspace-folder . --frozen-lockfile
      # post-create runs `mise install`, which downloads every pinned tool
      # from GitHub releases; unauthenticated, the shared runner IPs hit the
      # API rate limit. The token is the job's read-only one.
      - name: Start the dev container
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          npx -y @devcontainers/cli@0.89.0 up --workspace-folder .
          --remote-env "GITHUB_TOKEN=${GITHUB_TOKEN}" --remote-env CI=true
      # The Dockerfile only asserts that baked tools exist; this asserts each
      # reports the version it is pinned to, after post-create has run.
      - name: Verify the toolchain inside the dev container
        run: npx -y @devcontainers/cli@0.89.0 exec --workspace-folder . bash .devcontainer/scripts/verify-toolchain.sh

  required:
    name: Validate / Required
    if: always()
    needs:
      - detect
      - repository_lint
      - repository_secrets
      - codeowners
      - workflows
      - checks
      - content
      - cli
      - conventions
      - bundle
      - devcontainer
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # Anything other than success is a failure: a skipped or cancelled job
      # has proved nothing. A per-job exception needs its reason written next
      # to it, because a gate that can skip itself is the shape that reports
      # green forever. There are two:
      # - devcontainer may skip, but only when detect succeeded and said this
      #   pull request touched none of the files the image is built from. A
      #   skip for any other reason (detect failed, or said true) still fails.
      # - a job detect listed in passed_jobs may skip, but only when detect
      #   succeeded: detect lists a job only after proving a marker from an
      #   earlier run in which it passed on identical inputs (decision 0040).
      #   A skip of any job detect did not list still fails.
      - name: Classify every job result
        env:
          RESULTS: ${{ toJSON(needs) }}
          DEVCONTAINER_SCOPED: ${{ needs.detect.result == 'success' && needs.detect.outputs.devcontainer == 'false' }}
          PASSED_JOBS: ${{ needs.detect.result == 'success' && needs.detect.outputs.passed_jobs || '[]' }}
        run: |
          set -euo pipefail
          failed=0
          while read -r job result; do
            printf '%-20s %s\n' "$job" "$result"
            if [ "$job" = "devcontainer" ] && [ "$result" = "skipped" ] && [ "$DEVCONTAINER_SCOPED" = "true" ]; then
              echo "  skipped as planned: no dev container input changed"
              continue
            fi
            if [ "$result" = "skipped" ] \
              && jq -e --arg job "$job" 'any(.[]; . == $job)' <<<"$PASSED_JOBS" >/dev/null; then
              echo "  skipped as planned: inputs identical to a verified passing run"
              continue
            fi
            if [ "$result" != "success" ]; then
              echo "::error title=Validate / Required::job '$job' reported '$result'; only success passes"
              failed=1
            fi
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$RESULTS")
          exit "$failed"
