name: Validate

# Owns the judgement of every change to this repository: its own hygiene, the
# checks it ships (Rego, schemas, the conventions CLI), the content those checks
# are generated from, the release bundle, and whether this repository follows
# its own conventions. The pull request author reads a red job here; the one
# context branch protection requires is `Validate / Required`, which fails
# unless every other job succeeded.
#
# Each job runs `task` targets rather than tool commands, so a failure
# reproduces locally with the same command the job ran.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository_lint:
    name: Repository / Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          install-args: >-
            aqua:go-task/task node npm:markdownlint-cli2 aqua:astral-sh/uv
            pipx:yamllint aqua:crate-ci/typos aqua:koalaman/shellcheck
      - name: Lint Markdown, YAML, spelling and shell scripts
        run: task lint

  repository_secrets:
    name: Repository / Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The scan covers history, not just the tip: a secret removed in a
          # later commit is still published.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          install-args: aqua:go-task/task aqua:gitleaks/gitleaks
      - name: Scan the history for secrets
        run: task secrets:scan

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          # shellcheck is here because actionlint lints `run:` scripts with it
          # when it is on PATH, and silently skips them when it is not.
          install-args: >-
            aqua:go-task/task aqua:rhysd/actionlint aqua:zizmorcore/zizmor
            aqua:koalaman/shellcheck
      - name: Lint the workflows and composite actions
        env:
          # zizmor's online audits (impostor commits, stale version comments,
          # known-vulnerable actions) query the GitHub API.
          GH_TOKEN: ${{ github.token }}
        run: task lint:actions lint:actions:security

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          install-args: >-
            aqua:go-task/task aqua:open-policy-agent/conftest
            aqua:open-policy-agent/opa aqua:open-policy-agent/regal
      - name: Check, lint and test the Rego rules
        run: task checks:fmt:check checks:lint checks:check checks:test

  content:
    name: Content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          install-args: >-
            aqua:go-task/task aqua:astral-sh/uv pipx:check-jsonschema
            aqua:mikefarah/yq aqua:vale-cli/vale
      - name: Validate schemas, generated files and prose
        run: task schemas:check schemas:validate generate:check prose:lint

  cli:
    name: CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history so the invariants can read the published index.json at
      # the baseline commit and refuse a renumbered or dropped ID.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          # conftest is here because the test suite runs every fixture
          # repository through `conventions check`, which shells out to it.
          install-args: >-
            aqua:go-task/task aqua:astral-sh/uv aqua:open-policy-agent/conftest
      - name: Lint, type-check and test the conventions CLI
        run: task cli:lint cli:typecheck cli:test
      # The baseline is what the change builds on: the PR base, the merge
      # queue base, or the previous tip of main on push.
      - name: Check the content invariants against the baseline
        env:
          BASELINE: >-
            ${{ github.event.pull_request.base.sha
            || github.event.merge_group.base_sha
            || github.event.before }}
        run: task invariants BASELINE="$BASELINE"

  conventions:
    name: Conventions / Self
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          install-args: >-
            aqua:go-task/task aqua:astral-sh/uv aqua:open-policy-agent/conftest
      - name: Check this repository against its own conventions
        run: task conventions:self

  bundle:
    name: Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          install-args: >-
            aqua:go-task/task aqua:astral-sh/uv aqua:open-policy-agent/conftest
            aqua:open-policy-agent/opa aqua:vale-cli/vale aqua:jqlang/jq
      - name: Build the release bundle and verify it
        run: task bundle:build bundle:verify

  devcontainer:
    name: Dev Container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          install-args: node
      # --frozen-lockfile fails when devcontainer-lock.json is missing or its
      # Feature digests have drifted from devcontainer.json.
      - name: Build the dev container image
        run: npx -y @devcontainers/cli@0.89.0 build --workspace-folder . --frozen-lockfile
      # post-create runs `mise install`, which downloads every pinned tool
      # from GitHub releases; unauthenticated, the shared runner IPs hit the
      # API rate limit. The token is the job's read-only one.
      - name: Start the dev container
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          npx -y @devcontainers/cli@0.89.0 up --workspace-folder .
          --remote-env "GITHUB_TOKEN=${GITHUB_TOKEN}" --remote-env CI=true
      # The Dockerfile only asserts that baked tools exist; this asserts each
      # reports the version it is pinned to, after post-create has run.
      - name: Verify the toolchain inside the dev container
        run: npx -y @devcontainers/cli@0.89.0 exec --workspace-folder . bash .devcontainer/scripts/verify-toolchain.sh

  required:
    name: Validate / Required
    if: always()
    needs:
      - repository_lint
      - repository_secrets
      - workflows
      - checks
      - content
      - cli
      - conventions
      - bundle
      - devcontainer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Every job above is unconditional, so anything other than success is a
      # failure: a skipped or cancelled job has proved nothing. A per-job
      # exception needs its reason written next to it, because a gate that can
      # skip itself is the shape that reports green forever.
      - name: Classify every job result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=0
          while read -r job result; do
            printf '%-20s %s\n' "$job" "$result"
            if [ "$result" != "success" ]; then
              echo "::error title=Validate / Required::job '$job' reported '$result'; only success passes"
              failed=1
            fi
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$RESULTS")
          exit "$failed"
