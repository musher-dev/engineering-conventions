[project]
name = "repo-governance"
version = "0.1.0"
description = "Structural policy checks for the Musher dev container template."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
repo = "governance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["governance"]
