# This repository's own identity declaration (EC-0009). Its kind selects the
# specification profile, and `task conventions:self` checks its name against
# the origin remote (EC-0010).
schema_version = 1
name = "engineering-conventions"
system = "engineering"
component = "conventions"
kind = "specification"
owner = "@musher-dev/engineering"
lifecycle = "experimental"
audience = "public"
tier = 2

# Where the product lives (EC-0018): the directory a consumer pins, named
# after the repository. The Taskfile's PRODUCT_DIR and Dependabot's uv update
# name the same directory.
[layout]
product = "engineering-conventions"
