version: '3'

# Task entry point. It stays at the repository root because Task discovers
# Taskfile.* only there. These tasks act from the repository level and reach
# the product through PRODUCT_DIR. The layers, each with one job:
#
#   .config/<concern>/                    what counts as wrong: each tool's rules
#   taskfiles/tools/<tool>.Taskfile.yml   how one tool runs: its binary, config
#                                         path, severity flags, default file set
#                                         and cache sources. The only place the
#                                         binary is named. Included flattened
#                                         and internal, as tool:<tool>[:<x>], so
#                                         only another task can call it.
#   taskfiles/<area>.Taskfile.yml         which tools make up an area; every
#                                         public task is named <area>[:<x>]
#   this file                             setup, check, the environment tasks
#                                         (tools:*, hooks:*) and shared vars
#
# Names: a task that writes the fixes it finds ends in `:fix` (lint:md:fix,
# checks:fmt:fix), and `lint:fix` runs them all; no other task changes a file.
# `lint` runs every linter and format check. A format check is `<x>:fmt:check`,
# never a bare `fmt`, which reads as a formatter.
#
# Caching: a deterministic wrapper's whole-repository task (tool:<tool>:all)
# lists its sources (its files, its config, .config/mise/mise.lock and the
# Taskfiles that define it) with method checksum, so `task check` skips a gate
# whose sources are unchanged since it last passed here, and says so; `task
# --force check` reruns every gate. A cached task is never silent, since
# silence also hides Task's "is up to date". A run given files (`task lint:md
# -- README.md`, as the git hooks run) goes to tool:<tool>:files, which always
# runs and records nothing. The secret scan, online audits, network tests,
# git-ref comparisons and the bundle are never skipped. A local "up to date"
# is a convenience, never proof: CI runs every gate from a fresh checkout.

set: [errexit, nounset, pipefail]

includes:
  lint:
    taskfile: taskfiles/lint.Taskfile.yml
    flatten: true
  secrets:
    taskfile: taskfiles/secrets.Taskfile.yml
    flatten: true
  checks:
    taskfile: taskfiles/checks.Taskfile.yml
    flatten: true
  schemas:
    taskfile: taskfiles/schemas.Taskfile.yml
    flatten: true
  generate:
    taskfile: taskfiles/generate.Taskfile.yml
    flatten: true
  prose:
    taskfile: taskfiles/prose.Taskfile.yml
    flatten: true
  cli:
    taskfile: taskfiles/cli.Taskfile.yml
    flatten: true
  conventions:
    taskfile: taskfiles/conventions.Taskfile.yml
    flatten: true
  bundle:
    taskfile: taskfiles/bundle.Taskfile.yml
    flatten: true
  tool-actionlint:
    taskfile: taskfiles/tools/actionlint.Taskfile.yml
    flatten: true
    internal: true
  tool-basedpyright:
    taskfile: taskfiles/tools/basedpyright.Taskfile.yml
    flatten: true
    internal: true
  tool-check-jsonschema:
    taskfile: taskfiles/tools/check-jsonschema.Taskfile.yml
    flatten: true
    internal: true
  tool-conftest:
    taskfile: taskfiles/tools/conftest.Taskfile.yml
    flatten: true
    internal: true
  tool-gitleaks:
    taskfile: taskfiles/tools/gitleaks.Taskfile.yml
    flatten: true
    internal: true
  tool-hadolint:
    taskfile: taskfiles/tools/hadolint.Taskfile.yml
    flatten: true
    internal: true
  tool-markdownlint:
    taskfile: taskfiles/tools/markdownlint.Taskfile.yml
    flatten: true
    internal: true
  tool-opa:
    taskfile: taskfiles/tools/opa.Taskfile.yml
    flatten: true
    internal: true
  tool-pytest:
    taskfile: taskfiles/tools/pytest.Taskfile.yml
    flatten: true
    internal: true
  tool-regal:
    taskfile: taskfiles/tools/regal.Taskfile.yml
    flatten: true
    internal: true
  tool-ruff:
    taskfile: taskfiles/tools/ruff.Taskfile.yml
    flatten: true
    internal: true
  tool-shellcheck:
    taskfile: taskfiles/tools/shellcheck.Taskfile.yml
    flatten: true
    internal: true
  tool-spectral:
    taskfile: taskfiles/tools/spectral.Taskfile.yml
    flatten: true
    internal: true
  tool-taplo:
    taskfile: taskfiles/tools/taplo.Taskfile.yml
    flatten: true
    internal: true
  tool-typos:
    taskfile: taskfiles/tools/typos.Taskfile.yml
    flatten: true
    internal: true
  tool-vale:
    taskfile: taskfiles/tools/vale.Taskfile.yml
    flatten: true
    internal: true
  tool-yamllint:
    taskfile: taskfiles/tools/yamllint.Taskfile.yml
    flatten: true
    internal: true
  tool-zizmor:
    taskfile: taskfiles/tools/zizmor.Taskfile.yml
    flatten: true
    internal: true

vars:
  PRODUCT_DIR: '{{.ROOT_DIR}}/engineering-conventions'
  # Every product-level Python call goes through this, so the CLI always runs
  # from the committed lockfile: --locked fails rather than re-resolving.
  UV_RUN: uv run --project {{.ROOT_DIR}}/engineering-conventions --locked
  # Every file list comes from here, so every tool sees the same set: tracked
  # plus untracked-but-not-ignored.
  LIST_FILES: bash {{.ROOT_DIR}}/.github/scripts/list-files.sh

  # The Rego rules, the index they read and the JSON Schemas, each read by
  # more than one tool.
  REGO_DIR: '{{.PRODUCT_DIR}}/checks/rego'
  INDEX: '{{.PRODUCT_DIR}}/checks/data/index.json'
  SCHEMA_DIR: '{{.PRODUCT_DIR}}/checks/schemas'

  # taskfiles/bundle.Taskfile.yml
  DIST: '{{.ROOT_DIR}}/dist'
  VERSION:
    sh: tr -d '[:space:]' < '{{.ROOT_DIR}}/version.txt'
  TARBALL: engineering-conventions-{{.VERSION}}.tar.gz
  VALE_PACKAGE: MusherConventions.zip
  # The config package (EC-0038, decision 0024). Vale requires its root
  # directory to have the zip's name.
  PROSE_PACKAGE: MusherProse
  PROSE_STYLES: MusherConventions MusherCopy
  # The bundle's top-level entries under engineering-conventions/. The
  # authoring side (src/, tests/, pyproject.toml, uv.lock, .python-version)
  # is excluded because consumers run the rules with bin/conventions, which
  # needs conftest and jq (and Vale, Spectral or hadolint for those commands).
  # So are the Rego unit tests: conftest would load them as policy.
  BUNDLE_ENTRIES: README.md bin checks definitions examples

tasks:
  check:
    desc: Run every gate CI runs except the dev container build, fast first; --force reruns gates skipped as unchanged.
    cmds:
      - task: lint
      - task: secrets:scan
      - task: checks:compile
      - task: schemas:check
      - task: schemas:validate
      - task: generate:check
      - task: cli:typecheck
      - task: checks:test
      - task: checks:openapi
      - task: cli:test
      - task: cli:invariants
      - task: conventions:self
      - task: conventions:codeowners
      - task: bundle:build
      - task: bundle:verify

  setup:
    desc: Install the pinned toolchain, the conventions CLI and the git hooks.
    cmds:
      - task: tools:install
      - task: cli:sync
      - task: hooks:install

  tools:install:
    desc: Install every CLI pinned in .config/mise/config.toml, as its lockfile records it.
    cmds:
      - mise install --locked

  tools:lock:
    desc: Refresh .config/mise/mise.lock after changing a pin in .config/mise/config.toml.
    cmds:
      - mise lock

  tools:doctor:
    desc: Diagnose mise, and assert every pin (and the baked mise) is what is installed.
    cmds:
      - mise doctor
      - bash .devcontainer/scripts/verify-toolchain.sh

  hooks:install:
    desc: Install the lefthook git hooks from .config/lefthook.yml.
    cmds:
      - lefthook install
