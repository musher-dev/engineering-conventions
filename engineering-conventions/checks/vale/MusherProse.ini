# Generated by `conventions generate` from definitions/copy/style.yml.
# Do not edit: change the source there and regenerate.
# The .vale.ini of the MusherProse Vale package (EC-0038). `vale sync`
# installs the packages below beside its own styles, and Vale merges the
# toggles into the config that names the package.
Packages = https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip, https://github.com/vale-cli/write-good/releases/download/v0.4.1/write-good.zip, https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip, https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip

[*.{adoc,astro,ejs,erb,hbs,htm,html,jinja,liquid,markdown,md,mdoc,mdx,njk,rst,svelte,twig,txt,vue}]
# Flags every form of "to be", which most correct sentences use.
write-good.E-Prime = NO
# Passive voice is often the right choice in reference text, where the actor is the system.
write-good.Passive = NO
# Duplicates Microsoft.Wordiness with a longer, noisier list.
write-good.TooWordy = NO
# Wordy phrases with a shorter replacement for each.
Microsoft.Wordiness = YES
# Claims nobody can verify, such as "guarantee" and "simplest".
Google.ExcessiveClaims = YES
