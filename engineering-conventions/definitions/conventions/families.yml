# Requirement-ID families. A requirement ID is `<PREFIX>-<NN>`: the prefix is
# registered here, the number is monotonic within the family, and neither is
# ever reused -- a retired requirement stays in its convention as a tombstone
# (docs/decisions/0004-identifiers-and-diagnostic-urls.md).
schema_version: 1
families:
