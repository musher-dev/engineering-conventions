# The source of the MusherCopy Vale style and the MusherProse Vale package
# (EC-0038, decision 0024). `task generate` writes from it:
#   checks/vale/MusherCopy/<name>.yml   one Vale rule per entry in rules
#   checks/vale/MusherProse.ini         the package's .vale.ini
#   checks/data/index.json              the copy block the COPY checks read
# Validated against checks/schemas/copy-style.schema.json.
#
# The rules below are only what no adopted package covers. Before adding one,
# check proselint, write-good and the Microsoft and Google styles: a rule one of
# them ships is adopted, not rewritten.
schema_version: 1
package: MusherProse
style: MusherCopy

# The files copy is written in. Vale reads the native formats as they are; a
# template is mostly HTML, and Vale skips it unless the consumer's [formats]
# maps its extension (COPY-03). The package's toggles apply to these
# extensions only, so they never reach a code file's comments.
formats:
  native: [adoc, htm, html, markdown, md, mdx, rst, txt]
  templates:
    astro: html
    ejs: html
    erb: html
    hbs: html
    jinja: html
    liquid: html
    mdoc: md
    njk: html
    svelte: html
    twig: html
    vue: html

adopted:
  - style: proselint
    version: 0.3.4
    license: BSD-3-Clause
    source: https://github.com/vale-cli/proselint
    package: https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip
    use: whole
  - style: write-good
    version: 0.4.1
    license: MIT
    source: https://github.com/vale-cli/write-good
    package: https://github.com/vale-cli/write-good/releases/download/v0.4.1/write-good.zip
    use: whole
    disable:
      - rule: E-Prime
        reason: Flags every form of "to be", which most correct sentences use.
      - rule: Passive
        reason: Passive voice is often the right choice in reference text, where the actor is the system.
      - rule: TooWordy
        reason: Duplicates Microsoft.Wordiness with a longer, noisier list.
  - style: Microsoft
    version: 0.15.1
    license: MIT
    source: https://github.com/vale-cli/Microsoft
    package: https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip
    use: rules
    enable:
      - rule: Wordiness
        reason: Wordy phrases with a shorter replacement for each.
  - style: Google
    version: 0.7.1
    license: MIT
    source: https://github.com/vale-cli/Google
    package: https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip
    use: rules
    enable:
      - rule: ExcessiveClaims
        reason: Claims nobody can verify, such as "guarantee" and "simplest".

rules:
  - name: Banned
    extends: existence
    level: error
    locked: true
    message: "'%s' is banned in public copy. Name the behavior or the number instead."
    tokens:
      - seamless(?:ly|ness)?
      - robust(?:ly|ness)?
      - leverag(?:e|es|ed|ing)
      - empower(?:s|ed|ing|ment)?
      - supercharg(?:e|es|ed|ing)
      - unleash(?:es|ed|ing)?
      - revolutioni[sz](?:e|es|ed|ing)
      - revolutionary
      - AI[- ]powered
      - intelligent
      - effortless(?:ly)?
      - frictionless
      - holistic
      - game[- ]chang(?:er|ers|ing)
      - disruptive
      - synergi[sz](?:e|es|ed|ing)
      - turnkey
      - magical(?:ly)?
      - lightning[- ]fast
  - name: Placeholders
    extends: existence
    level: error
    locked: true
    note: TODO, FIXME and XXX are proselint.Annotations.
    message: "'%s' is a placeholder. Ship the content, or remove the section and track it in an issue."
    tokens:
      - TBD
      - TBC
      - coming soon
      - lorem ipsum
  - name: Generic
    extends: existence
    level: warning
    locked: false
    message: "'%s' describes nothing specific. Name the capability, the scale or the benchmark."
    tokens:
      - powerful
      - innovative
      - comprehensive
      - intuitive(?:ly)?
      - cutting[- ]edge
      - next[- ]gen(?:eration)?
      - enterprise[- ]grade
      - best[- ]in[- ]class
      - state[- ]of[- ]the[- ]art
      - world[- ]class
      - scalable
      - streamlin(?:e|es|ed|ing)
      - end[- ]to[- ]end
      - unprecedented
  - name: GenericContext
    extends: existence
    level: suggestion
    locked: false
    note: >-
      Generic in marketing copy but ordinary in technical text ("advanced
      configuration", "a modern browser", "unlock the state file"), so only a
      suggestion.
    message: "'%s' is relative to nothing. Say what it is more than, or what it does."
    tokens:
      - advanced
      - modern
      - smart
      - flexible
      - unlock(?:s|ed|ing)?
  - name: Hyperbole
    extends: existence
    level: warning
    locked: false
    message: "'%s' is a claim without proof. Replace it with a number, a name or a link."
    tokens:
      - the (?:leading|premier|ultimate|definitive)
      - (?:never|always) (?:fails?|breaks?|goes down)
      - \d{3,}% (?:faster|better|more|cheaper)
      - (?:transforms?|revolutioni[sz]es?|disrupts?) your
      - "everything you(?:'ll)? (?:ever )?need"
      - (?:unlimited|infinite|endless|limitless) \w+
  - name: Filler
    extends: existence
    level: warning
    locked: false
    note: >-
      "the fact that" after of, to, in, on or despite is Microsoft.Wordiness's,
      so it is not reported twice.
    message: "'%s' adds length, not meaning. Cut it, or use the verb directly."
    tokens:
      - 'helps? you(?: to)?'
      - (?:is|are) able to
      - that being said
      - 'it is (?:important|worth) (?:to note|noting)(?: that)?'
      - "in today's (?:world|landscape)"
      - when it comes to
      - at its core
      - really
      - truly
      - rather(?! than)
      - somewhat
      - basically
      - essentially
      - (?<!(?:of|to|in|on|despite) )the fact that
  - name: SentenceAverage
    extends: metric
    level: suggestion
    locked: false
    message: "Sentences here average %s words. Keep the average under 15."
    formula: words / sentences
    condition: "> 15"
  - name: ParagraphSentences
    extends: occurrence
    level: suggestion
    locked: false
    message: "More than three sentences in one paragraph. Split it into a statement and its proof."
    scope: paragraph
    max: 3
    token: '[^.!?]+[.!?]+(?:\s|$)'
