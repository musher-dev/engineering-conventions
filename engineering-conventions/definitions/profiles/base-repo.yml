# The profile every repository starts from, and the default when neither
# a conventions declaration nor the identity declaration's kind selects
# another. Every kind profile inherits it.
schema_version: 1
id: base-repo
display_name: Base repository
description: >-
  Every repository in the organisation: declaring its conventions, its
  outputs, the interfaces they deliver, the dependencies it vendors and
  its identity, releasing what it versions with release-please
  from drafts, a name from the registered systems, where its
  product lives, tool configuration kept in .config/ with every
  suppression reasoned and time-boxed, every tool version pinned once in
  mise, the GitHub Actions naming, structure and hygiene every repository
  with workflows shares, Taskfile style and a root Taskfile
  with setup, check and lint, the git hooks of any repository that uses
  lefthook, the agent context of any repository that has one, the shape
  of its decision records if it keeps any, the format of any
  environment schema it holds, the contract derived from it and the
  local .env that is never committed, the dev container of any
  repository that has one, where the files that build a container image
  live and the hadolint that lints each Dockerfile, the updater that
  keeps its actions, images and packages current, the ruleset that
  protects its default branch, the community files GitHub reads: issue
  and discussion forms, a CODEOWNERS, and a security policy,
  the OpenAPI documents of any OpenAPI interface it offers, the
  commit messages and pull request titles of every repository, checked
  by committed, and the Vale config that lints the copy of any site it
  publishes.
include:
  # OAS asks nothing of a repository that declares no openapi interface,
  # and an API can be offered by a service, a library or a specification, so
  # every kind selects it. COPY likewise applies only to a repository that
  # publishes a site, and IMAGE only to one with a Dockerfile or a compose
  # file.
  families:
    [
      ADOPT, GHA, OUT, REL, REPO, AGENT, CONF, HOOKS, TOOL, DEC, DEVC, DEPS, COMM, OAS, COMMIT, COPY,
      IMAGE, BRANCH,
    ]
  # EC-0015 applies to any Taskfile, and EC-0020 to any environment
  # schema. Of EC-0016 and EC-0019, only what every repository shares
  # (for EC-0019, where schemas live and what is derived from them) is
  # selected here; the kind profiles add the rest by ID, because an
  # exclude here would win over their includes. Of EC-0030, IFACE-08 (the
  # contracts directory) is added by the kinds whose product is not itself
  # the interfaces.
  conventions: [EC-0015, EC-0020, EC-0031]
  requirements:
    [
      TASK-10, TASK-13, ENVS-02, ENVS-15, ENVS-20, ENVS-26, ENVS-27,
      IFACE-01, IFACE-02, IFACE-03, IFACE-04, IFACE-05, IFACE-06, IFACE-07,
    ]
# Every requirement is proposed until the platform hands workflow naming over
# to this repository (docs/decisions/0002). Opting in here reports them at
# their warning severity now, so repositories see the migration they face
# before anything can fail their build.
include_proposed: true
