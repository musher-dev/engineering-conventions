# The profile the identity declaration selects for kind = "tool"
# (EC-0009). It adds the build and test tasks to what base-repo applies.
schema_version: 1
id: tool
display_name: Tool
description: >-
  Repositories whose kind is tool: everything base-repo applies, and a
  root Taskfile that also defines build and test (TASK-11).
inherits: [base-repo]
include:
  requirements: [TASK-11]
