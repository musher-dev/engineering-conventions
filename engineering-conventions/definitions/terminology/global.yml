# The global terminology. Every convention uses these words with these
# meanings.
# `conventions generate` projects the gha.*, outputs.*, repository.*,
# interfaces.* and runtime.* tags, the identifier-scope,
# repository-name-scope and action-token-scope aliases and the display forms
# into checks/data/index.json, and the prose-scope aliases into the
# MusherConventions Vale style.
schema_version: 1
description: >-
  Words the conventions themselves are written in, the GitHub Actions naming
  vocabulary, the vocabulary of a repository's identity and name, and
  pointers to terms another repository defines.

terms:
  # Workflow responsibility tokens: the first filename token of an
  # entry-point workflow (GHA-02).
  - id: gha.responsibility.validate
    display_name: validate
    token: validate
    definition: >-
      Decides whether a change may merge. A validate workflow checks the
      change and mutates nothing outside its own run.
    tags: [gha.responsibility]
    stability: provisional
    aliases:
      - text: ci
        status: banned
        scope: [identifier]
        note: Names the practice, not the result the workflow reports.
      - text: checks
        status: banned
        scope: [identifier]
        note: Every workflow runs checks; the token says nothing.
      - text: quality
        status: banned
        scope: [identifier]
        note: A synonym; one responsibility has one token.
      - text: lint
        status: banned
        scope: [identifier]
        note: Names a tool category; put it in the scope or a job name.
      - text: test
        status: banned
        scope: [identifier]
        note: Names an activity; put it in the scope or a job name.
      - text: tests
        status: banned
        scope: [identifier]
        note: Names an activity; put it in the scope or a job name.
      - text: gates
        status: banned
        scope: [identifier]
        note: A synonym; one responsibility has one token.
      - text: pr
        status: banned
        scope: [identifier]
        note: >-
          Names the trigger, not the responsibility. As a scope,
          validate-pull-request spells it out.
  - id: gha.responsibility.release
    display_name: release
    token: release
    definition: >-
      Versioning and changelog work: release pull requests, tags and GitHub
      Releases. A release workflow may also publish the artifacts of the
      release it cuts, in the same run, when the version is known only there;
      a workflow that only publishes is publish.
    tags: [gha.responsibility]
    stability: provisional
  - id: gha.responsibility.publish
    display_name: publish
    token: publish
    definition: >-
      Pushes a versioned artifact to a registry or distribution channel.
    tags: [gha.responsibility]
    stability: provisional
  - id: gha.responsibility.deploy
    display_name: deploy
    token: deploy
    definition: >-
      Changes what a running environment serves.
    tags: [gha.responsibility]
    stability: provisional
    aliases:
      - text: cd
        status: banned
        scope: [identifier]
        note: Names the practice, not the result the workflow reports.
      - text: rollout
        status: banned
        scope: [identifier]
        note: A synonym; one responsibility has one token.
      - text: ship
        status: banned
        scope: [identifier]
        note: A synonym; one responsibility has one token.
  - id: gha.responsibility.verify
    display_name: verify
    token: verify
    definition: >-
      Exercises a deployed environment to confirm it behaves as expected.
      Checking a change before it merges is validate, not verify.
    tags: [gha.responsibility]
    stability: provisional
  - id: gha.responsibility.monitor
    display_name: monitor
    token: monitor
    definition: >-
      A scheduled check for drift against something this repository does not
      own, such as an upstream release or a live setting. It reports and
      changes nothing.
    tags: [gha.responsibility]
    stability: provisional
    aliases:
      - text: drift
        status: banned
        scope: [identifier]
        note: Names what is found, not the responsibility that looks for it.
  - id: gha.responsibility.audit
    display_name: audit
    token: audit
    definition: >-
      A scheduled, report-only deep examination of this repository's own
      contents, such as dependencies or history, that is too slow or too
      broad to run on every change.
    tags: [gha.responsibility]
    stability: provisional
    aliases:
      - text: forensics
        status: banned
        scope: [identifier]
        note: A synonym; one responsibility has one token.
  - id: gha.responsibility.maintain
    display_name: maintain
    token: maintain
    definition: >-
      Changes non-product state the repository depends on, such as caches or
      vendored copies.
    tags: [gha.responsibility]
    stability: provisional
    aliases:
      - text: maintenance
        status: banned
        scope: [identifier]
        note: Tokens are verbs where a verb exists.
      - text: cleanup
        status: banned
        scope: [identifier]
        note: Names one activity of the responsibility.
  - id: gha.responsibility.repository
    display_name: repository
    token: repository
    definition: >-
      Automates the collaboration surface: issue and pull-request intake,
      labels, code-owner notices. It is a noun, which is why the first
      filename token is called the responsibility rather than the verb.
    tags: [gha.responsibility]
    stability: provisional
  - id: gha.responsibility.notify
    display_name: notify
    token: notify
    definition: >-
      Only sends a message, such as a digest of open pull requests to a chat
      channel, and changes nothing in the repository or elsewhere.
    tags: [gha.responsibility]
    stability: provisional

  # Capability tokens: what a reusable workflow provides (GHA-04).
  - id: gha.capability.build
    display_name: build
    token: build
    definition: >-
      A reusable workflow that produces an artifact for its caller to
      publish or deploy.
    tags: [gha.capability]
    stability: provisional
  - id: gha.capability.promote
    display_name: promote
    token: promote
    definition: >-
      A reusable workflow that moves an already-built artifact from one
      environment or channel to the next without rebuilding it.
    tags: [gha.capability]
    stability: provisional
  - id: gha.capability.check
    display_name: check
    token: check
    definition: >-
      A reusable workflow that runs one self-contained check and reports a
      result for its caller to aggregate.
    tags: [gha.capability]
    stability: provisional

  # Action tokens: the first token of a composite action's directory (GHA-20).
  - id: gha.action.setup
    display_name: setup
    token: setup
    definition: >-
      Prepares a toolchain or runtime and its cache so later steps can use
      it.
    tags: [gha.action]
    stability: provisional
  - id: gha.action.install
    display_name: install
    token: install
    definition: >-
      Installs one tool or dependency set without configuring a runtime
      around it.
    tags: [gha.action]
    stability: provisional
  - id: gha.action.authenticate
    display_name: authenticate
    token: authenticate
    definition: >-
      Obtains and exposes a credential for later steps, such as a registry
      login or an app token.
    tags: [gha.action]
    stability: provisional
    aliases:
      - text: auth
        status: banned
        scope: [action-token]
        note: An abbreviation; GHA-20 suggests authenticate in its place.
  - id: gha.action.check
    display_name: check
    token: check
    definition: >-
      Asserts a precondition and fails the job when it does not hold,
      changing nothing.
    tags: [gha.action]
    stability: provisional
    aliases:
      - text: validate
        status: banned
        scope: [action-token]
        note: >-
          The workflow responsibility that decides a merge; an action that
          confirms one precondition is check.
      - text: verify
        status: banned
        scope: [action-token]
        note: >-
          The workflow responsibility that exercises a deployed environment;
          an action that confirms one precondition is check.
  - id: gha.action.sync
    display_name: sync
    token: sync
    definition: >-
      Changes external state to match what the repository declares, such as
      a host's bootstrap configuration. It is the counterpart of check,
      which changes nothing.
    tags: [gha.action]
    stability: provisional

  # A trigger is not a responsibility (GHA-05, GHA-37): these tokens name
  # when a workflow runs, not what it is for.
  - id: gha.scheduled-workflow
    display_name: scheduled workflow
    definition: >-
      A workflow that runs on a schedule. The schedule is not its
      responsibility: name it for what the schedule serves -- audit for an
      examination of this repository's own contents, monitor for drift
      against something it does not own, maintain for changing non-product
      state.
    tags: [gha.concept]
    stability: provisional
    aliases:
      - text: scheduled
        status: banned
        scope: [identifier]
        suggest: audit, monitor or maintain
        note: Names the trigger, not the responsibility.
      - text: nightly
        status: banned
        scope: [identifier]
        suggest: audit, monitor or maintain
        note: Names the trigger, not the responsibility.
      - text: cron
        status: banned
        scope: [identifier]
        suggest: audit, monitor or maintain
        note: Names the trigger, not the responsibility.
      - text: weekly
        status: banned
        scope: [identifier]
        suggest: audit, monitor or maintain
        note: Names the trigger, not the responsibility.
      - text: daily
        status: banned
        scope: [identifier]
        suggest: audit, monitor or maintain
        note: Names the trigger, not the responsibility.

  # GitHub Actions concepts the conventions name.
  - id: gha.entry-point-workflow
    display_name: entry-point workflow
    definition: >-
      A workflow GitHub starts from an event other than workflow_call. Its
      filename starts with a responsibility token.
    tags: [gha.concept]
    stability: stable
  - id: gha.reusable-workflow
    display_name: reusable workflow
    definition: >-
      A workflow triggered only by workflow_call. Its filename starts with
      reusable- followed by a responsibility or capability token.
    tags: [gha.concept]
    stability: stable
  - id: gha.composite-action
    display_name: composite action
    definition: >-
      A local action under .github/actions/<action-token>-<object>/ that
      bundles steps a job reuses.
    tags: [gha.concept]
    stability: stable
  - id: gha.required-check
    display_name: required check
    definition: >-
      A status-check context a ruleset requires before a pull request may
      merge. Its name is an interface: renaming the job that emits it
      breaks merging until the ruleset changes too.
    tags: [gha.concept]
    stability: stable
  - id: gha.aggregate-check
    display_name: aggregate check
    definition: >-
      A job named <Workflow> / Required that runs even when a dependency
      fails (if: always() or !cancelled()), needs every other job in its
      workflow, and fails unless each of them succeeded or was skipped as
      its workflow's scope policy planned. It is the one context a ruleset
      requires from that workflow.
    tags: [gha.concept]
    stability: stable

  # Output kinds: what a repository publishes, named in the kind field of
  # .repo/outputs.toml (OUT-03). The formats they carry (OCI, OpenAPI and
  # the rest) are defined by their own specifications, not here.
  - id: outputs.kind.image
    display_name: container image
    token: image
    definition: >-
      An OCI container image pushed to a registry, consumed by pulling a
      tag or digest.
    tags: [outputs.kind]
    stability: provisional
  - id: outputs.kind.library
    display_name: library
    token: library
    definition: >-
      A package published to a language registry, such as npm, PyPI or a Go
      module proxy, consumed as a dependency.
    tags: [outputs.kind]
    stability: provisional
  - id: outputs.kind.cli
    display_name: command-line tool
    token: cli
    definition: >-
      An executable released as downloadable assets, consumed by pinning a
      version in a tool manager such as mise.
    tags: [outputs.kind]
    stability: provisional
  - id: outputs.kind.contract
    display_name: contract
    token: contract
    definition: >-
      A machine-readable interface definition other repositories build
      against, such as an OpenAPI, AsyncAPI, protobuf or JSON Schema
      document.
    tags: [outputs.kind]
    stability: provisional
    deprecated:
      note: >-
        An interface definition is not something a repository delivers but a
        surface an output delivers. Declare it in [[interfaces]] in
        .repo/outputs.toml (schema_version 2), delivered by a bundle, site or
        library output (decision 0022).
      replaced_by: conventions.interface
  - id: outputs.kind.bundle
    display_name: bundle
    token: bundle
    definition: >-
      A versioned archive of files released as assets and consumed by
      pinning, such as this repository's release.
    tags: [outputs.kind]
    stability: provisional
  - id: outputs.kind.site
    display_name: site
    token: site
    definition: >-
      Files served at a stable HTTPS origin that people or tools fetch by
      URL, such as a schema host or a documentation site. Its versioned
      paths never change once served; aliases such as a major version may
      move.
    tags: [outputs.kind]
    stability: provisional
  - id: outputs.kind.vmimage
    display_name: machine image
    token: vmimage
    definition: >-
      A bootable virtual machine disk image, such as a cloud provider
      snapshot, that hosts are created from, consumed by referring to its
      version.
    tags: [outputs.kind]
    stability: provisional

  # Interface formats: the format field of an [[interfaces]] entry in
  # .repo/outputs.toml (IFACE-02). Each format is defined by its own
  # specification; the term only names it.
  - id: interfaces.format.openapi
    display_name: OpenAPI
    token: openapi
    definition: >-
      An OpenAPI document describing an HTTP API: its paths, operations and
      schemas (https://spec.openapis.org/oas/).
    tags: [interfaces.format]
    stability: provisional
  - id: interfaces.format.asyncapi
    display_name: AsyncAPI
    token: asyncapi
    definition: >-
      An AsyncAPI document describing message-driven channels and the
      messages on them (https://www.asyncapi.com/docs/reference).
    tags: [interfaces.format]
    stability: provisional
  - id: interfaces.format.json-schema
    display_name: JSON Schema
    token: json-schema
    definition: >-
      One or more JSON Schema documents describing JSON values, such as
      event payloads or a document format (https://json-schema.org).
    tags: [interfaces.format]
    stability: provisional
  - id: interfaces.format.protobuf
    display_name: Protocol Buffers
    token: protobuf
    definition: >-
      Protocol Buffers definitions: messages and gRPC services, in .proto
      files (https://protobuf.dev).
    tags: [interfaces.format]
    stability: provisional
  - id: interfaces.format.env-schema
    display_name: environment schema
    token: env-schema
    definition: >-
      An env.schema.yaml, the variables a product reads from its
      environment, when another repository deploys or configures it
      (EC-0020).
    tags: [interfaces.format]
    stability: provisional
  - id: interfaces.format.weaver
    display_name: Weaver registry
    token: weaver
    definition: >-
      An OpenTelemetry Weaver semantic convention registry: the telemetry
      signals and attributes a producer emits
      (https://github.com/open-telemetry/weaver).
    tags: [interfaces.format]
    stability: provisional
  - id: interfaces.format.data
    display_name: data document
    token: data
    definition: >-
      One or more JSON or YAML documents that are themselves the published
      fact, such as a registry, a vocabulary or a rate card, rather than a
      schema describing other documents. When a data document has a schema,
      the schema is a json-schema interface of its own or ships beside it.
    tags: [interfaces.format]
    stability: provisional
  - id: interfaces.format.systemd-unit
    display_name: systemd unit
    token: systemd-unit
    definition: >-
      systemd unit files (service, timer, socket and the other unit types)
      that another repository installs on the hosts it configures
      (https://www.freedesktop.org/software/systemd/man/latest/systemd.unit.html).
    tags: [interfaces.format]
    stability: provisional

  # Interface compatibility: what a producer promises about a change to an
  # interface, the compatibility field of an [[interfaces]] entry.
  - id: interfaces.compatibility.gated
    display_name: gated
    token: gated
    definition: >-
      A change that breaks a consumer ships only in a release marked
      breaking: a major release from 1.0.0, a minor release in the 0.x
      series. The producer's contracts:breaking task compares each change
      with the last release and fails on a break that no commit marked ! or
      carrying BREAKING CHANGE signals.
    tags: [interfaces.compatibility]
    stability: provisional
  - id: interfaces.compatibility.versioned
    display_name: versioned
    token: versioned
    definition: >-
      Each file carries its major version in its name, as .vN., and a
      published file never changes: a break is a new file with the next
      number, and the old one stays for the consumers that read it.
    tags: [interfaces.compatibility]
    stability: provisional
  - id: interfaces.compatibility.lockstep
    display_name: lockstep
    token: lockstep
    definition: >-
      No compatibility promise across releases: only consumers released
      together with the producer, in the same composition, may depend on
      it.
    tags: [interfaces.compatibility]
    stability: provisional

  # Runtime capabilities: what an environment binding reaches when it is not
  # another Musher service, the capability field of a binding in
  # env.schema.yaml (ENVS-18). A capability names what the code needs, never
  # the cluster, bucket or account that provides it in an environment.
  - id: runtime.capability.postgresql
    display_name: PostgreSQL
    token: postgresql
    definition: >-
      A PostgreSQL database the process connects to, including a queue or notification channel it keeps in PostgreSQL.
    tags: [runtime.capability]
    stability: provisional
  - id: runtime.capability.object-storage
    display_name: object storage
    token: object-storage
    definition: >-
      An object store the process reads or writes through an S3-compatible API or a provider's own.
    tags: [runtime.capability]
    stability: provisional
  - id: runtime.capability.otlp
    display_name: OTLP endpoint
    token: otlp
    definition: >-
      An OpenTelemetry collector the process exports traces, metrics or logs to over OTLP.
    tags: [runtime.capability]
    stability: provisional
  - id: runtime.capability.email-delivery
    display_name: email delivery
    token: email-delivery
    definition: >-
      A service the process sends email through, over SMTP or a provider's API.
    tags: [runtime.capability]
    stability: provisional
  - id: runtime.capability.payments
    display_name: payments
    token: payments
    definition: >-
      A payment provider the process charges, refunds or reconciles through.
    tags: [runtime.capability]
    stability: provisional
  - id: runtime.capability.llm
    display_name: language model
    token: llm
    definition: >-
      A hosted language model the process sends prompts to.
    tags: [runtime.capability]
    stability: provisional
  - id: runtime.capability.oauth-identity
    display_name: OAuth identity provider
    token: oauth-identity
    definition: >-
      An OAuth or OpenID Connect provider users sign in with.
    tags: [runtime.capability]
    stability: provisional
  - id: runtime.capability.code-hosting
    display_name: code hosting
    token: code-hosting
    definition: >-
      A source code host the process calls as an application, such as a GitHub App.
    tags: [runtime.capability]
    stability: provisional
  - id: runtime.capability.dns
    display_name: DNS
    token: dns
    definition: >-
      A DNS provider whose records the process reads or changes.
    tags: [runtime.capability]
    stability: provisional
  - id: runtime.capability.cdn
    display_name: CDN
    token: cdn
    definition: >-
      A content delivery network whose caching and delivery the process configures or purges. It does not cover an
      edge platform's storage or compute, which is edge-compute.
    tags: [runtime.capability]
    stability: provisional
  - id: runtime.capability.vpn-mesh
    display_name: VPN mesh
    token: vpn-mesh
    definition: >-
      An overlay network the process joins or manages peers on.
    tags: [runtime.capability]
    stability: provisional
  - id: runtime.capability.block-storage
    display_name: block storage
    token: block-storage
    definition: >-
      A block storage system whose volumes the process provisions or attaches.
    tags: [runtime.capability]
    stability: provisional
  - id: runtime.capability.cloud-compute
    display_name: cloud compute
    token: cloud-compute
    definition: >-
      A cloud provider whose machines the process creates or destroys.
    tags: [runtime.capability]
    stability: provisional
  - id: runtime.capability.web-search
    display_name: web search
    token: web-search
    definition: >-
      A search engine API the process queries.
    tags: [runtime.capability]
    stability: provisional
  - id: runtime.capability.container-registry
    display_name: container registry
    token: container-registry
    definition: >-
      A container image registry the process, or the machines it manages, pull images from or push images to.
    tags: [runtime.capability]
    stability: provisional
  - id: runtime.capability.edge-compute
    display_name: edge compute
    token: edge-compute
    definition: >-
      An edge platform's key-value store or functions the process writes to or deploys.
    tags: [runtime.capability]
    stability: provisional
  - id: runtime.capability.access-proxy
    display_name: access proxy
    token: access-proxy
    definition: >-
      An identity-aware proxy in front of services the process calls, to which the process presents a service
      credential.
    tags: [runtime.capability]
    stability: provisional
  - id: runtime.capability.valkey
    display_name: Valkey
    token: valkey
    definition: >-
      A Valkey key-value server the process reads from and writes to over its Redis-compatible protocol: a cache,
      counters or short-lived state. It names the engine, as postgresql does, because the engine's protocol and
      semantics are what the code depends on. A Redis server is a different engine, not this one.
    tags: [runtime.capability]
    stability: provisional

  # Systems: the first token of a repository's name (REPO-09) and the system
  # field of .repo/repository.toml (REPO-03). A system groups repositories by
  # what they provide together; it is never a team.
  - id: repository.system.platform
    display_name: platform
    token: platform
    definition: >-
      The hosted Musher product: the API and the applications, sites and
      contracts that serve its users and operators.
    tags: [repository.system]
    stability: provisional
  - id: repository.system.host
    display_name: host
    token: host
    definition: >-
      The software that runs on Musher compute, gateway and storage hosts:
      the agent, its configuration and the images that carry them.
    tags: [repository.system]
    stability: provisional
  - id: repository.system.sdk
    display_name: sdk
    token: sdk
    definition: >-
      The client libraries and command-line tool developers use to reach the
      platform from their own code and terminals.
    tags: [repository.system]
    stability: provisional
  - id: repository.system.infra
    display_name: infra
    token: infra
    definition: >-
      The infrastructure-as-code that provisions and governs the estate: the
      landing zone, the platform's infrastructure and the GitHub
      organization.
    tags: [repository.system]
    stability: provisional
  - id: repository.system.observability
    display_name: observability
    token: observability
    definition: >-
      How the estate is observed: the registry of telemetry names and the
      stack that collects and shows the telemetry. The names themselves are
      defined in that registry, not here.
    tags: [repository.system]
    stability: provisional
  - id: repository.system.engineering
    display_name: engineering
    token: engineering
    definition: >-
      How Musher builds software: the conventions, contributor
      documentation, the development container and engineering tools.
    tags: [repository.system]
    stability: provisional
  - id: repository.system.brand
    display_name: brand
    token: brand
    definition: >-
      Musher's public presence and visual identity: the website and the
      design system.
    tags: [repository.system]
    stability: provisional
  - id: repository.system.company
    display_name: company
    token: company
    definition: >-
      How Musher operates as an organization, and the sites that present it
      to its members and investors.
    tags: [repository.system]
    stability: provisional
  - id: repository.system.catalog
    display_name: catalog
    token: catalog
    definition: >-
      The curated content users install through the platform: catalog items
      and example applications. The format of a catalog item is defined by
      its specification, not here.
    tags: [repository.system]
    stability: provisional

  # Repository kinds: a repository's primary role, the kind field of
  # .repo/repository.toml (REPO-03). The kind selects the convention profile
  # of the same name. What a repository publishes is its outputs
  # declaration, not its kind.
  - id: repository.kind.service
    display_name: service
    token: service
    definition: >-
      A repository whose primary role is a deployable process: an API
      server, a worker or an agent.
    tags: [repository.kind]
    stability: provisional
  - id: repository.kind.website
    display_name: website
    token: website
    definition: >-
      A repository whose primary role is a site or browser application that
      people use through a web browser.
    tags: [repository.kind]
    stability: provisional
  - id: repository.kind.library
    display_name: library
    token: library
    definition: >-
      A repository whose primary role is code other repositories import as
      a dependency.
    tags: [repository.kind]
    stability: provisional
  - id: repository.kind.tool
    display_name: tool
    token: tool
    definition: >-
      A repository whose primary role is a program people run from a
      terminal or a pipeline, such as a command-line tool.
    tags: [repository.kind]
    stability: provisional
  - id: repository.kind.infrastructure
    display_name: infrastructure
    token: infrastructure
    definition: >-
      A repository whose primary role is infrastructure-as-code that
      provisions or configures environments, accounts or an organization.
    tags: [repository.kind]
    stability: provisional
  - id: repository.kind.specification
    display_name: specification
    token: specification
    definition: >-
      A repository whose primary role is a definition other repositories are
      built or checked against: a format, a schema, a contract or a set of
      conventions.
    tags: [repository.kind]
    stability: provisional
  - id: repository.kind.content
    display_name: content
    token: content
    definition: >-
      A repository whose primary role is curated material consumed as data
      rather than run, such as catalog items or examples.
    tags: [repository.kind]
    stability: provisional
  - id: repository.kind.documentation
    display_name: documentation
    token: documentation
    definition: >-
      A repository whose primary role is prose for people to read, published
      as a site or read in place.
    tags: [repository.kind]
    stability: provisional
  - id: repository.kind.template
    display_name: template
    token: template
    definition: >-
      A repository whose primary role is a starting point other repositories
      copy or build on, such as a development container or a project
      scaffold.
    tags: [repository.kind]
    stability: provisional

  # Lifecycles: the lifecycle field of .repo/repository.toml (REPO-03), the
  # values Backstage uses for spec.lifecycle.
  - id: repository.lifecycle.experimental
    display_name: experimental
    token: experimental
    definition: >-
      Early or exploratory: it may change or disappear without notice, and
      nothing should depend on it in production.
    tags: [repository.lifecycle]
    stability: provisional
  - id: repository.lifecycle.production
    display_name: production
    token: production
    definition: >-
      Maintained and relied on: changes to what it offers follow its
      versioning and are announced.
    tags: [repository.lifecycle]
    stability: provisional
  - id: repository.lifecycle.deprecated
    display_name: deprecated
    token: deprecated
    definition: >-
      Being retired: it receives only fixes, and its dependents are moving
      away from it.
    tags: [repository.lifecycle]
    stability: provisional

  # Audiences: the audience field of .repo/repository.toml (REPO-03). Who
  # the repository's outputs are for, which is not the same as whether
  # GitHub shows the repository to the public.
  - id: repository.audience.internal
    display_name: internal
    token: internal
    definition: >-
      Its outputs are for Musher's own repositories and people.
    tags: [repository.audience]
    stability: provisional
  - id: repository.audience.public
    display_name: public
    token: public
    definition: >-
      Its outputs are for people and code outside Musher, such as customers
      or the open-source community.
    tags: [repository.audience]
    stability: provisional

  # The words this repository is written in.
  - id: conventions.convention
    display_name: convention
    definition: >-
      A document under definitions/conventions/<topic>/ with an EC-
      identifier that states related requirements and explains them.
    tags: [meta]
    stability: stable
  - id: conventions.requirement
    display_name: requirement
    definition: >-
      One normative statement inside a convention, with a permanent ID such
      as GHA-07, a status, a default severity and a validation engine.
    tags: [meta]
    stability: stable
    aliases:
      - text: rule id
        status: banned
        scope: [prose]
        suggest: requirement ID
        note: Rules are prose files elsewhere; a requirement has an ID.
  - id: conventions.check
    display_name: check
    definition: >-
      An implementation that finds violations of a requirement, such as a
      Rego package here or an existing check in another repository.
    tags: [meta]
    stability: stable
  - id: conventions.waiver
    display_name: waiver
    definition: >-
      A time-boxed, tracked deviation from one requirement, declared in a
      consuming repository's conventions declaration.
    tags: [meta]
    stability: stable
    # Not "exception" (Conftest's exception rules, language exceptions) or
    # "exemption". These are deliberately not shipped as Vale aliases: the
    # style runs over consumers' prose, where "exception" is usually correct.
  - id: conventions.topic
    display_name: topic
    definition: >-
      The part of a repository a group of conventions governs, named for its
      file surface or tool, such as github-actions; a subdirectory of
      definitions/conventions/.
    tags: [meta]
    stability: stable
  - id: conventions.convention-profile
    display_name: convention profile
    definition: >-
      A named selection of requirements, with their severities, for one kind
      of repository.
    tags: [meta]
    stability: stable
    aliases:
      - text: baseline profile
        status: banned
        scope: [prose]
        note: Baseline reads as a Kubernetes Pod Security Standards level.
  - id: conventions.conventions-declaration
    display_name: conventions declaration
    definition: >-
      The file .repo/conventions.toml in a consuming repository, which pins a
      release, names a convention profile and lists waivers.
    tags: [meta]
    stability: stable
    aliases:
      - text: conventions manifest
        status: banned
        scope: [prose]
        note: Manifest already names bundle and package metadata files.
  - id: conventions.family
    display_name: family
    definition: >-
      A registered requirement-ID prefix, such as GHA, listed in
      definitions/conventions/families.yml.
    tags: [meta]
    stability: stable
  - id: conventions.display-form
    display_name: display form
    definition: >-
      How an identifier token is written when a display name is derived from
      it, such as api written API.
    tags: [meta]
    stability: stable
  - id: conventions.output
    display_name: output
    definition: >-
      Something a repository publishes for other repositories or people to
      consume, such as a container image, a library, a command-line tool, a
      bundle or a site. The interfaces a repository offers are delivered by
      its outputs.
    tags: [meta]
    stability: provisional
  - id: conventions.outputs-declaration
    display_name: outputs declaration
    definition: >-
      The file .repo/outputs.toml in a repository that publishes, which
      lists each output with its kind, source, publishing workflow, location
      and consumption docs.
    tags: [meta]
    stability: provisional
  - id: conventions.interface
    display_name: interface
    definition: >-
      A surface another repository builds or runs against, such as one
      OpenAPI document of an API, a family of event schemas or a registry of
      problem types, declared in [[interfaces]] in .repo/outputs.toml with
      its format, its definition files, the output that delivers it and its
      compatibility. It is addressed as <repository>#<interface>.
    tags: [meta]
    stability: provisional
  - id: conventions.dependency
    display_name: dependency
    definition: >-
      An edge from one repository to another repository's release. One whose
      files are vendored is declared in .repo/dependencies.toml with its
      pin; one through a package or tool manager is read from that
      manager's manifest; a runtime edge is read from the environment
      binding that reaches it.
    tags: [meta]
    stability: provisional
  - id: conventions.dependencies-declaration
    display_name: dependencies declaration
    definition: >-
      The file .repo/dependencies.toml in a repository that vendors another
      repository's interfaces, which lists each vendored release with its
      exact version.
    tags: [meta]
    stability: provisional
  - id: conventions.pin
    display_name: pin
    definition: >-
      The exact release version a consumer depends on, written in exactly
      one place: the dependencies declaration for a vendored copy, or the
      package or tool manager's manifest otherwise. Never a commit SHA,
      branch or range.
    tags: [meta]
    stability: provisional
  - id: conventions.release-record
    display_name: release record
    definition: >-
      The release.json at the root of a bundle that delivers interfaces:
      the release it belongs to, and each interface with the SHA-256 of
      each of its files (release-record.schema.json).
    tags: [meta]
    stability: provisional
  - id: conventions.vendored-copy
    display_name: vendored copy
    definition: >-
      The files of another repository's release a consumer commits, under
      <product>/contracts/vendor/<repository>/<output>/, with the producer's
      release record unchanged beside them. Never edited by hand.
    tags: [meta]
    stability: provisional
  - id: conventions.runtime-capability
    display_name: runtime capability
    definition: >-
      Something a service needs at runtime that is not another Musher
      service, such as PostgreSQL or object storage, named on the
      environment binding that reaches it. Which resource provides it is a
      fact of each environment, not of the declaration.
    tags: [meta]
    stability: provisional
  - id: conventions.system
    display_name: system
    definition: >-
      A registered grouping of repositories that together provide one part
      of what Musher builds, such as platform or sdk. Its token is the first
      token of each of their names. A system is named for what its
      repositories provide, never for a team: one team owns every
      repository of a system, but the grouping outlives any team structure.
    tags: [meta]
    stability: provisional
  - id: conventions.component
    display_name: component
    definition: >-
      What one repository holds within its system, named by the rest of the
      repository's name after the system token, such as api in platform-api.
    tags: [meta]
    stability: provisional
  - id: conventions.release-component
    display_name: release component
    definition: >-
      One package a repository versions and releases on its own, one entry
      of its release-please config's packages, named by the component its
      tags carry, such as blueprint in blueprint/v1.6.0.
    tags: [meta]
    stability: provisional
  - id: conventions.repository-name
    display_name: repository name
    definition: >-
      A repository's name on GitHub, written <system>-<component> in
      lowercase kebab-case. It names what the repository holds, and nothing
      the organization, the declaration or the history already says.
    tags: [meta]
    stability: provisional
    # Tokens banned anywhere in a repository name (REPO-10). The note is the
    # advice the check prints. A version suffix such as v2 is refused by a
    # pattern in the check, not listed here.
    aliases:
      - text: musher
        status: banned
        scope: [repository-name]
        note: >-
          The organization already says it; drop the token.
      - text: repo
        status: banned
        scope: [repository-name]
        note: >-
          GitHub already says it is a repository; drop the token.
      - text: common
        status: banned
        scope: [repository-name]
        note: >-
          Says who uses it, not what it holds; name what it holds.
      - text: shared
        status: banned
        scope: [repository-name]
        note: >-
          Says who uses it, not what it holds; name what it holds.
      - text: utils
        status: banned
        scope: [repository-name]
        note: >-
          Says nothing about what it holds; name what it holds.
      - text: util
        status: banned
        scope: [repository-name]
        note: >-
          Says nothing about what it holds; name what it holds.
      - text: misc
        status: banned
        scope: [repository-name]
        note: >-
          Says nothing about what it holds; name what it holds.
      - text: new
        status: banned
        scope: [repository-name]
        note: >-
          Names a lifecycle, which changes while the name must not; drop the
          token and set lifecycle = "experimental" in .repo/repository.toml.
      - text: legacy
        status: banned
        scope: [repository-name]
        note: >-
          Names a lifecycle, which changes while the name must not; drop the
          token and set lifecycle = "deprecated" in .repo/repository.toml.
      - text: old
        status: banned
        scope: [repository-name]
        note: >-
          Names a lifecycle, which changes while the name must not; drop the
          token and set lifecycle = "deprecated" in .repo/repository.toml.
  - id: conventions.identity-declaration
    display_name: identity declaration
    definition: >-
      The file .repo/repository.toml in every repository, which states its
      name, system, component, kind, owner, lifecycle, audience and tier.
    tags: [meta]
    stability: provisional
  - id: conventions.agent-context
    display_name: agent context
    definition: >-
      The files a repository commits to give a coding agent its
      instructions: every CLAUDE.md, the rules under .claude/rules/, and
      AGENTS.md.
    tags: [meta]
    stability: provisional
  - id: conventions.project-memory
    display_name: project memory
    definition: >-
      The one CLAUDE.md, at the root or in .claude/, that Claude Code loads
      at every launch, together with the files it imports.
    tags: [meta]
    stability: provisional
  - id: conventions.path-scoped-rule
    display_name: path-scoped rule
    definition: >-
      A Markdown file under .claude/rules/ whose paths frontmatter names the
      files it governs, so it loads only when an agent works on one of them.
    tags: [meta]
    stability: provisional

  # Defined upstream and deliberately not restated here. GitHub Actions
  # uses audit and drift in a narrower, automation sense: see
  # gha.responsibility.audit and the drift alias of gha.responsibility.monitor.
  - id: governance.audit
    display_name: audit
    authority:
      repo: musher-dev/platform
      path: .claude/rules/terminology.md
    tags: [governance]
    stability: stable
  - id: governance.drift
    display_name: drift
    authority:
      repo: musher-dev/platform
      path: .claude/rules/terminology.md
    tags: [governance]
    stability: stable
  - id: governance.gate
    display_name: gate
    authority:
      repo: musher-dev/platform
      path: .claude/rules/terminology.md
    tags: [governance]
    stability: stable
  - id: governance.conformance
    display_name: conformance
    authority:
      repo: musher-dev/platform
      path: .claude/rules/terminology.md
    tags: [governance]
    stability: stable

