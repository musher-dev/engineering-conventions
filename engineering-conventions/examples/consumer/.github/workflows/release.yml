name: Release

# Owns the release pull request, the release tag and the release (EC-0026).
# release-please keeps one open pull request that bumps version.txt and
# CHANGELOG.md; a person merges it, and the next run creates the `vX.Y.Z` tag
# and a draft GitHub Release. Image builds the service image from that tag and
# pushes it with its build provenance; Publish Release then publishes the draft,
# which from that moment is immutable (REL-14).
#
# The image goes to a registry, not onto the release, so the release carries
# no assets and needs no SHA256SUMS (REL-18). A draft left behind by a failed
# Image job is finished by dispatching this workflow with the draft's tag
# (REL-20); a dispatched run refuses a release that is already published.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of a draft release to finish, such as v1.2.3.
        required: true
        type: string

# Every job states what it needs; the release App's token makes the writes that
# must start other workflows or bypass the tag ruleset.
permissions: {}

# Queued, never cancelled: a run cancelled between creating a tag and
# publishing its release leaves a draft to finish by hand (REL-15).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_please:
    name: Release PR and Tags
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The release App's token, never the default token (GHA-47, REL-16): a
      # release pull request the default token opens starts no workflow, so it
      # would never report its required contexts.
      - name: Mint the release App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ steps.app_token.outputs.token }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  image:
    name: Image
    needs: release_please
    # !cancelled(): the dispatch path skips release_please, and a skip must not
    # silently skip the image with it (GHA-48).
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch'
      || needs.release_please.outputs.release_created == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read  # check out the tag, read the draft
      packages: write  # push the image
      id-token: write  # sign the provenance attestation
      attestations: write  # store the provenance attestation
      artifact-metadata: write  # record the attested image
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release_please.outputs.tag_name }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check the release is a draft with a release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not a release version (vX.Y.Z)"
            exit 1
          fi
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$draft" != "true" ]]; then
            echo "::error::release $TAG is not a draft; a published release cannot change"
            exit 1
          fi

      # The tag release-please just created, not the branch head: the image is
      # built from exactly the commit the release names (OUT-09).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Log in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"

      # The OCI annotations tie the image to this repository, commit and
      # release (OUT-10). No GitHub Actions cache backend (GHA-42).
      - name: Build and push the image
        id: build
        run: |
          set -euo pipefail
          version="${TAG#v}"
          docker buildx build platform-api \
            --file platform-api/docker/Dockerfile \
            --push \
            --tag "$IMAGE:$version" \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.version=$version" \
            --metadata-file metadata.json
          echo "digest=$(jq -r '."containerimage.digest"' metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Attest the image's build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  finalize:
    name: Publish Release
    needs: [release_please, image]
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release_please.outputs.tag_name }}
    steps:
      # The release App publishes (REL-19): a release the default token
      # publishes starts no workflow on its `published` event.
      - name: Mint the release App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      # Immutable releases are a setting no file records; reading the release
      # back is how the run proves it is on (REL-14).
      - name: Check the published release is immutable
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .immutable)"
          if [[ "$immutable" != "true" ]]; then
            echo "::error::release $TAG was published but is not immutable; enable immutable releases"
            exit 1
          fi
