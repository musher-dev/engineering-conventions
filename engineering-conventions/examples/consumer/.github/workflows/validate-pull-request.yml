name: Validate Pull Request

# Decides whether the pull request title may become the squash commit. It is a
# workflow of its own because it re-runs when the title is edited, an event the
# Validate workflow should not re-run for.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  title:
    name: Validate Pull Request / Title
    # A merge group has no title. The skip is reported to the ruleset as a
    # skipped check, which satisfies it.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read       # read .config/commits/committed.toml
      pull-requests: read  # read the title through the API
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          version: 2026.9.12

      # The rules the commit-msg hook applies, from the same file (COMMIT-04).
      # The title reaches committed on stdin from the environment, never
      # interpolated into the script, so it cannot inject into the shell.
      - name: Check the title passes committed
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | committed --config .config/commits/committed.toml --commit-file -

      # committed cannot require a scope or a lowercase subject; the action
      # checks those, with the types and scopes read from the same file.
      - name: Read the allowed types and scopes
        id: allowed
        run: |
          set -euo pipefail
          {
            echo "types<<EOF"
            yq -p toml -o yaml '.allowed_types[]' .config/commits/committed.toml
            echo "EOF"
            echo "scopes<<EOF"
            yq -p toml -o yaml '.allowed_scopes[]' .config/commits/committed.toml
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check the title has a scope and a lowercase subject
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: ${{ steps.allowed.outputs.types }}
          scopes: ${{ steps.allowed.outputs.scopes }}
          requireScope: true
          subjectPattern: ^[a-z].+$
