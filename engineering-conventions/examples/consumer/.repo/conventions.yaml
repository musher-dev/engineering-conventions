# The conventions this repository is checked against (EC-0001).
schema_version: 1

conventions:
  # The Validate workflow downloads the bundle for exactly this version, so an
  # upgrade is this one line.
  version: "0.1.0"

profile: base-repo

# Time-boxed deviations. Each needs a reason, a tracking issue and an expiry at
# most 180 days out; an expired waiver stops suppressing its finding.
waivers: []
