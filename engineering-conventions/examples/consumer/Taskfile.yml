version: '3'

# The task interface (EC-0016): setup, check and lint in every repository,
# build and test because the kind is service, and dev because a service is
# something people run while they work on it. `task check` runs every gate
# the Validate workflow runs, so a change that passes here passes there
# (TASK-13).

vars:
  # The declared product directory (REPO-21): the product's toolchain runs
  # there, never from the root.
  PRODUCT_DIR: '{{.ROOT_DIR}}/platform-api'
  IMAGE: platform-api

tasks:
  setup:
    desc: Install the tools pinned in .config/mise/config.toml.
    cmds:
      - mise install

  check:
    desc: Run every gate the Validate workflow runs.
    cmds:
      - task: lint
      - task: test
      - task: conventions

  lint:
    desc: Lint the workflows with actionlint and zizmor.
    cmds:
      - actionlint
      - zizmor --min-severity medium .github

  conventions:
    desc: Check the repository against its pinned conventions release.
    cmds:
      - conventions check --fail-on warning

  build:
    desc: Build the service image.
    cmds:
      - docker build --tag {{.IMAGE}} {{.PRODUCT_DIR}}

  test:
    desc: Run the tests.
    dir: '{{.PRODUCT_DIR}}'
    cmds:
      - go test ./...

  dev:
    desc: Run the service locally.
    dir: '{{.PRODUCT_DIR}}'
    cmds:
      - go run .
