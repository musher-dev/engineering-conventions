[project]
name = "conventions-tools"
# Never published as a package: the release version is version.txt at the
# repository root, and consumers use the generated bundle, not this code.
version = "0.0.0"
description = "Authoring and checking tools for musher-dev/engineering-conventions."
requires-python = ">=3.13"
dependencies = [
  "jsonschema>=4.26",
  "pyyaml>=6.0.3",
]

[project.scripts]
conventions = "conventions_tools.cli:main"

[dependency-groups]
dev = [
  "basedpyright==1.40.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-timeout==2.4.0",
  "pytest-xdist==3.8.0",
  "ruff==0.16.8",
  "types-jsonschema",
  "types-pyyaml",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C4",
  "DTZ",
  "E",
  "ERA",
  "F",
  "FBT",
  "I",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "RET",
  "RUF",
  "SIM",
  "UP",
  "W",
]
# PLR2004 flags every literal in an assertion; the tests compare against
# literal expectations on purpose.
ignore = ["PLR2004"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Most of the suite is subprocesses (conftest, the launcher, vale), one fixture
# repository each, so it spreads across every core; worksteal evens out the
# slow launcher tests. -n 0 runs it serially, for a debugger.
addopts = [
  "--strict-markers",
  "--strict-config",
  "-n=auto",
  "--dist=worksteal",
  "--durations=15",
]
# A hung subprocess fails its test, well inside the CI job's timeout.
timeout = 300
