# Conforms to every rule of checks/openapi/musher.spectral.yaml and of
# spectral:oas recommended: `task checks:openapi` expects no finding.
openapi: 3.1.0
info:
  title: Orders
  version: 1.0.0
  description: Orders placed by a customer.
  contact:
    name: Orders team
    url: https://example.com/orders
servers:
  - url: https://api.example.com
tags:
  - name: orders
    description: Orders placed by a customer.
paths:
  /v1/orders:
    get:
      operationId: list_orders
      summary: List orders
      description: List the orders of the calling customer.
      tags: [orders]
      responses:
        "200":
          description: The orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "404":
          description: No such customer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/orders:batchCreate:
    post:
      operationId: batch_create_orders
      summary: Create several orders
      description: Create several orders, each succeeding or failing on its own.
      tags: [orders]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateOrdersRequest"
      responses:
        "207":
          description: One result per order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCreateOrdersResponse"
components:
  schemas:
    Order:
      type: object
      description: An order.
      properties:
        orderId:
          type: string
          description: The order's ID.
        state:
          $ref: "#/components/schemas/OrderState"
        isPaid:
          type: boolean
          description: Whether the order is paid.
        receiptURL:
          description: Where the receipt is, once there is one.
          anyOf:
            - type: string
            - type: "null"
        payment:
          $ref: "#/components/schemas/Payment"
    OrderState:
      type: string
      description: Where the order is in its lifecycle.
      enum: [PENDING, SHIPPED, DELIVERED]
    Payment:
      description: How the order is paid.
      oneOf:
        - $ref: "#/components/schemas/CardPayment"
        - $ref: "#/components/schemas/InvoicePayment"
      discriminator:
        propertyName: kind
    CardPayment:
      type: object
      description: A card payment.
      properties:
        kind:
          type: string
          description: Always CARD.
          enum: [CARD]
    InvoicePayment:
      type: object
      description: An invoice payment.
      properties:
        kind:
          type: string
          description: Always INVOICE.
          enum: [INVOICE]
    BatchCreateOrdersRequest:
      type: object
      description: The orders to create.
      properties:
        orders:
          type: array
          description: The orders.
          items:
            $ref: "#/components/schemas/Order"
    BatchCreateOrdersResponse:
      type: object
      description: One result per order.
      properties:
        orders:
          type: array
          description: The created orders.
          items:
            $ref: "#/components/schemas/Order"
    Problem:
      type: object
      description: An RFC 9457 problem.
      properties:
        title:
          type: string
          description: A short summary of the problem.
