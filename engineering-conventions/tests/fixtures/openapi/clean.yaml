# Passes every rule of spectral:oas recommended and of the OWASP API security
# ruleset: `task checks:openapi` expects no finding with spectral.yaml.
openapi: 3.1.0
info:
  title: Orders
  version: 1.0.0
  description: Orders placed by a customer.
  contact:
    name: Orders team
    url: https://example.com/orders
servers:
  - url: https://api.example.com
    x-internal: false
security:
  - bearer: []
tags:
  - name: orders
    description: Orders placed by a customer.
paths:
  /v1/orders:
    get:
      operationId: list_orders
      summary: List orders
      description: List the orders of the calling customer.
      tags: [orders]
      responses:
        "200":
          description: The orders.
          headers:
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  headers:
    Access-Control-Allow-Origin:
      description: The origins that may read the response.
      schema:
        type: string
        maxLength: 256
        format: uri
    RateLimit:
      description: The caller's remaining quota.
      schema:
        type: string
        maxLength: 256
        pattern: "^[ -~]*$"
  responses:
    Problem:
      description: The request failed.
      headers:
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/Access-Control-Allow-Origin"
        RateLimit:
          $ref: "#/components/headers/RateLimit"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: The caller has used its quota.
      headers:
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/Access-Control-Allow-Origin"
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        Retry-After:
          description: Seconds until the quota resets.
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 86400
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    OrderList:
      type: object
      description: A page of orders.
      properties:
        orders:
          type: array
          description: The orders.
          maxItems: 100
          items:
            $ref: "#/components/schemas/Order"
    Order:
      type: object
      description: An order.
      properties:
        orderId:
          type: string
          description: The order's ID.
          format: uuid
          maxLength: 36
        state:
          type: string
          description: Where the order is in its lifecycle.
          enum: [PENDING, SHIPPED, DELIVERED]
    Problem:
      type: object
      description: An RFC 9457 problem.
      properties:
        title:
          type: string
          description: A short summary of the problem.
          maxLength: 200
          pattern: "^[^\\n]*$"
