assert_lefthook_installed: true
min_version: "2.1.14"
glob_matcher: doublestar
commit-msg:
  skip:
    - merge
    - rebase
  jobs:
    - name: message
      group:
        jobs:
          - name: committed
            run: committed --config=".config/commits/committed.toml" --commit-file={1}
            fail_text: "The message must pass .config/commits/committed.toml."
