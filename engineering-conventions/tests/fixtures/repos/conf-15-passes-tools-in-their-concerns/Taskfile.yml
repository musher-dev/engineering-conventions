version: '3'

vars:
  IMAGE: platform-api

tasks:
  setup:
    desc: Install the pinned tools.
    cmds:
      - mise install

  check:
    desc: Run every gate CI runs.
    cmds:
      - task: lint
      - task: test

  lint:
    desc: Lint the workflows.
    cmds:
      - actionlint
      - vale --config .config/prose/vale.ini docs
      - zizmor --config .config/actions/zizmor.yml .github
      - hadolint --config .config/docker/hadolint.yaml Dockerfile
      - typos --config .config/spelling/_typos.toml

  build:
    desc: Build the image.
    deps: [_login]
    cmds:
      - docker build -t {{.IMAGE}} .

  test:
    desc: Run the tests.
    cmds:
      - go test ./...

  dev:
    desc: Run the API locally.
    cmds:
      - go run .

  _login:
    internal: true
    cmds:
      - docker login ghcr.io
