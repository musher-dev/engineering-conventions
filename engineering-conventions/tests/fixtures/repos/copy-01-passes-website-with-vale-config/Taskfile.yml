version: '3'

vars:
  IMAGE: platform-api

tasks:
  setup:
    desc: Install the pinned tools.
    cmds:
      - mise install

  check:
    desc: Run every gate CI runs.
    cmds:
      - task: lint
      - task: test

  lint:
    desc: Lint the workflows and the site's copy.
    cmds:
      - actionlint
      - mkdir -p .vale
      - vale --config .config/markdown/vale.ini sync
      - vale --config .config/markdown/vale.ini site/src

  build:
    desc: Build the image.
    deps: [_login]
    cmds:
      - docker build -t {{.IMAGE}} .

  test:
    desc: Run the tests.
    cmds:
      - go test ./...

  dev:
    desc: Run the API locally.
    cmds:
      - go run .

  _login:
    internal: true
    cmds:
      - docker login ghcr.io
