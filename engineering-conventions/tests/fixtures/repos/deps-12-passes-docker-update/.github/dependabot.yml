version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/platform-api"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/platform-api/docker"
    schedule:
      interval: "weekly"
