# The environment host-agent reads, vendored unchanged from its release
# (EC-0032). It names its own components, which this repository does not.
service: host-agent
runtime: go
naming:
  components: [AGENT]
bindings:
  AGENT_API_BASE_URL:
    type: string
    format: url
    required: true
    sensitivity: internal
    description: The API the agent registers with and reports to.
  Agent_Poll:
    type: integer
    default: 30
    sensitivity: internal
    description: Seconds between two polls of the work queue.
