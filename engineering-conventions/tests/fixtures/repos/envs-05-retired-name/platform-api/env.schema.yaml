service: platform-api
runtime: go
naming:
  components: [API, DATABASE]
bindings:
  API_LEGACY_TOKEN:
    type: string
    sensitivity: secret
    description: Token the retired callers presented on every request.
retired:
  - name: API_LEGACY_TOKEN
    retired_on: "2026-05-01"
    reason: Requests authenticate with signed service tokens instead.
