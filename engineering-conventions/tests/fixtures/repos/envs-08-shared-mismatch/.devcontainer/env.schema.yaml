service: devcontainer
runtime: docker-compose
bindings:
  API_SIGNING_KEY:
    type: string
    sensitivity: internal
    local_default: ""
    description: Key the local API signs service tokens with, shared with local workers.
shared_with:
  - name: API_SIGNING_KEY
    apps:
      - {service: platform-api, path: /platform-api/runtime}
      - {service: devcontainer, path: /devcontainer}
