service: platform-api
runtime: go
naming:
  components: [API, DATABASE]
bindings:
  API_SIGNING_KEY:
    type: string
    sensitivity: secret
    description: Key the API signs service tokens with; workers verify with the same key.
shared_with:
  - name: API_SIGNING_KEY
    apps:
      - {service: platform-api, path: /platform-api/runtime}
      - {service: devcontainer, path: /devcontainer}
