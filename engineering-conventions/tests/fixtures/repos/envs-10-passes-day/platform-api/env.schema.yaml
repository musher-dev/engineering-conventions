# The runtime environment platform-api reads (EC-0019, EC-0020).
service: platform-api
runtime: go
naming:
  components: [API, DATABASE]
bindings:
  API_EXPORT_RETENTION_DAY:
    type: integer
    default: 7
    sensitivity: internal
    description: Days a finished export stays downloadable before it is deleted.
  API_SESSION_TTL_HR:
    type: integer
    default: 12
    sensitivity: internal
    description: Hours a signed-in session lasts without a request before it expires.
