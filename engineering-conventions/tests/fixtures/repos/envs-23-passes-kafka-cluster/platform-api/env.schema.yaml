# The runtime environment platform-api reads (EC-0019, EC-0020), with the
# Kafka cluster it publishes to, ranged by the engine's major version.
service: platform-api
runtime: go
naming:
  components: [API, DATABASE, KAFKA]
requires:
  events:
    capability: kafka
    version: ">=4, <5"
    description: The cluster the outbox relay publishes integration events to.
bindings:
  API_PORT:
    type: integer
    default: 8080
    sensitivity: internal
    description: TCP port the HTTP server listens on inside the container.
  API_REQUEST_TIMEOUT_SEC:
    type: integer
    default: 30
    constraints: {min: 1, max: 300}
    sensitivity: internal
    description: Seconds a request may run before the server cancels it and answers 503.
  DATABASE_URL:
    type: string
    format: url
    required: true
    sensitivity: secret
    local_default: postgres://postgres@localhost:5432/app
    description: Connection string of the primary Postgres database, credentials included.
  ENABLE_AUDIT_LOG:
    type: boolean
    default: false
    sensitivity: internal
    description: Writes an audit event for every state-changing request when true.
  KAFKA_BOOTSTRAP_SERVERS:
    type: string
    default: ""
    sensitivity: internal
    requires: events
    description: Comma-separated host:port pairs of the brokers the producer first connects to; empty turns it off.
  KAFKA_USERNAME:
    type: string
    default: ""
    sensitivity: internal
    requires: events
    description: The SCRAM principal the producer authenticates as.
  KAFKA_PASSWORD:
    type: string
    sensitivity: secret
    requires: events
    description: The SCRAM password of that principal.
