# The runtime environment platform-api reads (EC-0019, EC-0020), with the
# runtime instances it needs and the versions its code works with.
service: platform-api
runtime: go
naming:
  components: [API, CACHE, DATABASE]
requires:
  primary-db:
    capability: postgresql
    version: ">=17, <19"
    description: Every account, workspace and job.
  cache:
    capability: valkey
    version: ">=9, <10"
    description: Rate-limit counters and short-lived sessions.
bindings:
  API_PORT:
    type: integer
    default: 8080
    sensitivity: internal
    description: TCP port the HTTP server listens on inside the container.
  API_REQUEST_TIMEOUT_SEC:
    type: integer
    default: 30
    constraints: {min: 1, max: 300}
    sensitivity: internal
    description: Seconds a request may run before the server cancels it and answers 503.
  CACHE_URL:
    type: string
    format: url
    required: true
    sensitivity: secret
    local_default: redis://localhost:15433/0
    requires: kv
    description: Address of the Valkey server that holds rate-limit counters and sessions.
  DATABASE_URL:
    type: string
    format: url
    required: true
    sensitivity: secret
    local_default: postgres://postgres@localhost:5432/app
    requires: primary-db
    description: Connection string of the primary Postgres database, credentials included.
  DATABASE_ADMIN_URL:
    type: string
    format: url
    sensitivity: secret
    local_default: postgres://postgres@localhost:5432/app
    requires: primary-db
    description: Connection string the migrations run with, as the database owner.
  ENABLE_AUDIT_LOG:
    type: boolean
    default: false
    sensitivity: internal
    description: Writes an audit event for every state-changing request when true.
