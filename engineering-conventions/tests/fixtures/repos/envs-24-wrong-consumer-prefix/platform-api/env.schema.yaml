# The runtime environment platform-api reads (EC-0019, EC-0020), each
# binding named after the program that reads it.
service: platform-api
runtime: go
naming:
  consumer_prefix: MUSHER_PLATFORM_API
  components: [CACHE, DATABASE, HTTP]
  vendor_prefixes: [OTEL_]
  legacy: [DATABASE_URL]
bindings:
  MUSHER_PLATFORM_API_CACHE_URL:
    type: string
    format: url
    required: true
    sensitivity: secret
    local_default: redis://localhost:15433/0
    description: Address of the Valkey server that holds rate-limit counters and sessions.
  MUSHER_PLATFORM_API_HTTP_PORT:
    type: integer
    default: 8080
    sensitivity: internal
    description: TCP port the HTTP server listens on inside the container.
  DATABASE_URL:
    type: string
    format: url
    required: true
    sensitivity: secret
    local_default: postgres://postgres@localhost:5432/app
    description: Connection string of the primary Postgres database, credentials included.
  MUSHER_ENVIRONMENT:
    type: string
    default: development
    sensitivity: internal
    description: The environment the process runs in, which names its logs and metrics.
  OTEL_SERVICE_NAME:
    type: string
    default: platform-api
    sensitivity: internal
    description: The service name the OpenTelemetry SDK reports traces and metrics under.
