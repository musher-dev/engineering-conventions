# The runtime environment platform-api reads (EC-0019, EC-0020).
service: platform-api
runtime: go
naming:
  components: [API, DATABASE]
bindings:
  MUSHER_ENVIRONMENT:
    type: enum
    values: [development, production, staging, test]
    local_default: development
    sensitivity: internal
    description: The deployment environment the API runs in; selects its default origins.
  NODE_ENV:
    type: enum
    values: [development, production]
    sensitivity: internal
    grammar_exempt: true
    grammar_exempt_reason: Node and its bundlers read it by this name.
    description: The build mode the bundled admin assets are compiled in.
  API_ENVIRONMENT_FILE:
    type: string
    format: path
    sensitivity: internal
    description: Path of an extra environment file the API reads at start, when set.
