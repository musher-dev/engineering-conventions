# The runtime environment platform-api reads (EC-0019, EC-0020).
service: platform-api
runtime: go
naming:
  components: [API, DATABASE]
  vendor_prefixes: [OTEL_]
bindings:
  API_ENV:
    type: string
    sensitivity: internal
    description: The deployment environment, under the API's own name.
  API_DEPLOYMENT_ENVIRONMENT:
    type: string
    sensitivity: internal
    description: The deployment environment, again, for the API's error reports.
  OTEL_ENVIRONMENT:
    type: string
    sensitivity: internal
    description: The deployment environment the exporter attaches to every span.
