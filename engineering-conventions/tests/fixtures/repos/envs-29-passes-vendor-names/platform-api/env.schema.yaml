# The runtime environment platform-api reads (EC-0019, EC-0020).
service: platform-api
runtime: go
naming:
  components: [API, DATABASE]
  vendor_prefixes: [OTEL_, GITHUB_]
bindings:
  OTEL_SDK_DISABLED:
    type: boolean
    default: false
    sensitivity: internal
    description: Turns every OpenTelemetry signal off when true.
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:
    type: string
    format: url
    local_default: http://localhost:4318/v1/traces
    sensitivity: internal
    description: The collector the API exports trace spans to.
  GITHUB_SHA:
    type: string
    lifecycle: build-time
    sensitivity: internal
    description: The commit the image was built from, baked into the binary's version string.
  API_GITHUB_APP_PRIVATE_KEY:
    type: string
    sensitivity: secret
    description: The key the API signs GitHub App installation token requests with.
