# The runtime environment platform-api reads (EC-0019, EC-0020).
service: platform-api
runtime: go
naming:
  components: [API, DATABASE]
bindings:
  MUSHER_DEVELOPER_SLUG:
    type: string
    sensitivity: internal
    description: The developer whose own environment this is, naming their resources.
  API_E2E_TEST_TIMEOUT_SEC:
    type: integer
    default: 60
    sensitivity: internal
    description: Seconds the end-to-end smoke test waits for the API to answer.
  API_DEVICE_ID:
    type: string
    sensitivity: internal
    description: The identifier the API reports itself under to the device registry.
