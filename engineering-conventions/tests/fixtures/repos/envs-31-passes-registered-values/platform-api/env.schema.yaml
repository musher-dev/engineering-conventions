# The runtime environment platform-api reads (EC-0019, EC-0020).
service: platform-api
runtime: go
naming:
  components: [API, DATABASE]
  vendor_prefixes: [OTEL_]
bindings:
  API_LOG_LEVEL:
    type: enum
    values: [trace, debug, info, warn, error]
    default: info
    sensitivity: internal
    description: The least severe log record the API writes.
  API_LOG_FORMAT:
    type: enum
    values: [json, text]
    default: json
    sensitivity: internal
    description: How the API writes each log record, json for the collector or text for a terminal.
  OTEL_LOG_LEVEL:
    type: string
    default: INFO
    sensitivity: internal
    description: How much the OpenTelemetry SDK logs about itself.
