# The dev container's environment (EC-0020): what its stacks read.
service: devcontainer
runtime: docker-compose
bindings:
  POSTGRES_PASSWORD:
    type: string
    sensitivity: internal
    local_default: hunter2
    consumers: [postgres]
    mirrored_in: [./stacks//postgres/init.sql]
    description: Password of the local Postgres superuser, dev-only and never deployed.
  POSTGRES_PORT:
    type: integer
    sensitivity: internal
    local_default: 15432
    mirrored_in: [stacks/postgres/init.sql]
    description: Host port the local Postgres publishes, in the reserved dev range.
