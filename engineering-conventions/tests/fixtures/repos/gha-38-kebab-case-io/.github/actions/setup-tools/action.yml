name: Setup Tools
description: Install the pinned toolchain.
inputs:
  tool_version:
    description: The toolchain release to install.
    required: true
runs:
  using: composite
  steps:
    - name: Install the toolchain
      id: install_toolchain
      shell: bash
      env:
        TOOL_VERSION: ${{ inputs.tool_version }}
      run: echo "installing $TOOL_VERSION"
