name: Deploy API
on:
  workflow_dispatch:
    inputs:
      digest:
        description: The image digest to deploy
        required: true
        type: string
      version:
        description: The release version to deploy
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      artifact-metadata: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Deploy the service
        run: task deploy
      - name: Record the deployment
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ inputs.digest }}
          VERSION: ${{ inputs.version }}
        run: >-
          gh api -X POST "orgs/${GITHUB_REPOSITORY_OWNER}/artifacts/metadata/deployment-record"
          -f name=ghcr.io/musher-dev/platform-api -f digest="${DIGEST}" -f version="${VERSION}"
          -f status=deployed -f logical_environment=production
          -f physical_environment=example-cloud/us-east -f deployment_name=platform-api
