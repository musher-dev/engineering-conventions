version: '3'

vars:
  IMAGE: platform-api

tasks:
  setup:
    desc: Install the pinned tools.
    cmds:
      - mise install

  check:
    desc: Run every gate CI runs.
    cmds:
      - task: lint
      - task: test

  lint:
    desc: Lint the workflows.
    cmds:
      - actionlint

  build:
    desc: Build the image.
    deps: [_login]
    cmds:
      - docker build -t {{.IMAGE}} .

  test:
    desc: Run the tests.
    cmds:
      - go test ./...

  dev:
    desc: Run the API locally.
    cmds:
      - go run .

  _login:
    internal: true
    cmds:
      - docker login ghcr.io

  record:deployment:
    desc: Record the deployment in the organization's linked artifacts.
    requires:
      vars: [DIGEST, VERSION]
    cmds:
      - >-
        gh api -X POST "orgs/${GITHUB_REPOSITORY_OWNER}/artifacts/metadata/deployment-record"
        -f name=ghcr.io/musher-dev/platform-api -f digest="{{.DIGEST}}" -f version="{{.VERSION}}"
        -f status=deployed -f logical_environment=production -f deployment_name=platform-api
