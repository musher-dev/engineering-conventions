schema_version = 2

[[outputs]]
id = "contracts"
kind = "bundle"
description = "Each release's interfaces, with their release record."
source = "platform-api/contracts/"
publish_workflow = "publish-contracts.yml"
location = "https://github.com/example/platform-api/releases"
docs = "platform-api/contracts/README.md"

[[interfaces]]
id = "problem-types"
format = "data"
description = "The registry of problem types the API returns, which clients match on."
definitions = ["platform-api/contracts/registries/problem-types.json"]
delivered_by = "contracts"
compatibility = "gated"
audience = "public"
generated = true

[[interfaces]]
id = "events"
format = "json-schema"
definitions = ["platform-api/contracts/events/*.schema.json"]
delivered_by = "contracts"
compatibility = "versioned"
audience = "internal"
generated = true
