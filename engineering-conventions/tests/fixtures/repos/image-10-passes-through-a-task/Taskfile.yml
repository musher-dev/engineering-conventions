version: '3'

vars:
  IMAGE: platform-api

tasks:
  setup:
    desc: Install the pinned tools.
    cmds:
      - mise install

  check:
    desc: Run every gate CI runs.
    cmds:
      - task: lint
      - task: test

  lint:
    desc: Lint the workflows.
    cmds:
      - actionlint
      - task: lint:docker

  build:
    desc: Build the image.
    deps: [_login]
    cmds:
      - docker build -t {{.IMAGE}} .

  test:
    desc: Run the tests.
    cmds:
      - go test ./...

  dev:
    desc: Run the API locally.
    cmds:
      - go run .

  lint:docker:
    desc: Lint the Dockerfiles.
    cmds:
      - git ls-files -z '*Dockerfile' | xargs -0 -r hadolint --config .config/docker/hadolint.yaml

  _login:
    internal: true
    cmds:
      - docker login ghcr.io
