name: Publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Publish the image
        run: task publish
