name: Publish Assets
on:
  release:
    types: [published]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  assets:
    name: Assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Package the extra assets and their checksums
        run: |
          mkdir dist
          tar -czf dist/extras.tar.gz platform-api
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Attest the extra assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Upload the extra assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
