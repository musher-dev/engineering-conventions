version: '3'

vars:
  IMAGE: platform-api
  SITE: site

tasks:
  setup:
    desc: Install the pinned tools.
    cmds:
      - mise install

  check:
    desc: Run every gate CI runs.
    cmds:
      - task: lint
      - task: test

  lint:
    desc: Lint the workflows.
    cmds:
      - actionlint

  build:
    desc: Build the image.
    deps: [_login]
    cmds:
      - docker build -t {{.IMAGE}} .

  test:
    desc: Run the tests.
    cmds:
      - go test ./...

  dev:
    desc: Run the API locally.
    cmds:
      - go run . --out {{.SITE}}

  _login:
    internal: true
    cmds:
      - docker login ghcr.io
