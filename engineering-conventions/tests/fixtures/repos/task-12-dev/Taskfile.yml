version: '3'

tasks:
  setup:
    desc: Install the pinned tools.
    cmds:
      - mise install

  check:
    desc: Run every gate CI runs.
    cmds:
      - task: lint
      - task: test

  lint:
    desc: Lint the workflows.
    cmds:
      - actionlint

  build:
    desc: Build the binary.
    cmds:
      - go build ./...

  test:
    desc: Run the tests.
    cmds:
      - go test ./...

  start:
    desc: Run the API locally.
    cmds:
      - go run .
