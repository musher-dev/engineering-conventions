version: '3'

vars:
  CACHE: '{{.ROOT_DIR}}/workspace-cache'
  # The dev container's working directory, the same in every clone of it.
  WORKSPACE: /workspaces/platform-api

tasks:
  build:
    desc: Build the binary inside the builder image.
    cmds:
      # The image mounts the checkout at /workspace.
      - docker run --rm -v "{{.ROOT_DIR}}:/workspace" -w /workspace golang:1.25 go build -o /tmp/app ./...
      - echo "Built /workspace/app in the container; open {{.ROOT_DIR}} in your editor."
      - /usr/bin/env bash -c 'ls /opt /tmp' > /dev/null
      - cd {{.WORKSPACE}} && ls /workspaces/platform-api/dist
