version: '3'

vars:
  IMAGE: platform-api

tasks:
  setup:
    desc: Install the pinned tools.
    cmds:
      - mise install

  check:
    desc: Run every gate CI runs.
    cmds:
      - task: lint
      - task: test

  lint:
    desc: Lint the workflows.
    cmds:
      - task: tool:actionlint

  build:
    desc: Build the image.
    deps: [_login]
    cmds:
      - docker build -t {{.IMAGE}} .

  test:
    desc: Run the tests.
    cmds:
      - go test ./...

  dev:
    desc: Run the API locally.
    cmds:
      - go run .

  _login:
    internal: true
    cmds:
      - docker login ghcr.io

  vet:
    desc: Vet the Go code.
    sources:
      - platform-api/**
      - '**/*.mod'
      - '{{.ROOT_DIR}}/platform-api/*.{mod,sum}'
      - dist/**/*.js
      - exclude: platform-api/**/*.golang
    cmds:
      - go vet ./...
