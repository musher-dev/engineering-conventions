name: Setup Tools
description: Install the pinned toolchain.
inputs:
  tool-version:
    description: The toolchain release to install.
    required: true
runs:
  using: composite
  steps:
    - name: Install Node
      id: install_node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
      with:
        node-version: 22.1.0
