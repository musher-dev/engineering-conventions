version: '3'

# Checks: the Rego rules in engineering-conventions/checks/rego, formatted,
# linted, type-checked and unit-tested, and the OpenAPI ruleset shape OAS-02
# asks for, each through its tool's wrapper in taskfiles/tools/. The
# fixture-repo pass (every requirement proved against a miniature repository)
# runs under `cli:test`, because the CLI is what feeds a repository to
# conftest. checks:fmt:check reports; checks:fmt:fix writes.

set: [errexit, nounset, pipefail]

tasks:
  checks:fmt:check:
    desc: Fail if any Rego file is not opa fmt-formatted (lists the files).
    cmds:
      - task: tool:opa:fmt:check

  checks:fmt:fix:
    desc: Format the Rego rules in place with opa fmt (files after -- narrow it).
    cmds:
      - task: tool:opa:fmt:fix
        vars: {FILES: '{{.CLI_ARGS}}'}

  checks:lint:
    desc: Lint the Rego rules with Regal (.config/rego/regal.yaml); warnings fail.
    cmds:
      - task: tool:regal

  checks:compile:
    desc: Parse and type-check the Rego rules against the generated index with opa check --strict.
    cmds:
      - task: tool:opa:check

  checks:test:
    desc: Run the Rego unit tests under conftest and opa; fail below the coverage threshold or on zero tests.
    cmds:
      - task: tool:conftest
      - task: tool:opa:test

  checks:openapi:
    desc: Test that a ruleset meeting OAS-02 loads both upstream rulesets, passes clean.yaml and reports insecure.yaml.
    vars:
      OPENAPI_FIXTURES: '{{.PRODUCT_DIR}}/tests/fixtures/openapi'
      REPORTS:
        sh: mktemp -d
    cmds:
      - defer: rm -rf "{{.REPORTS}}"
      # The ruleset extends the OWASP ruleset by URL, so this needs the
      # network. A ruleset Spectral cannot load exits 2 and fails the task.
      - task: tool:spectral
        vars:
          RULESET: '{{.OPENAPI_FIXTURES}}/spectral.yaml'
          FILES: '{{.OPENAPI_FIXTURES}}/clean.yaml'
          REPORT: '{{.REPORTS}}/clean.json'
      - |
        if [[ "$(jq length "{{.REPORTS}}/clean.json")" != 0 ]]; then
          jq -r '.[] | "clean.yaml: \(.code) at \(.path | join("."))"' "{{.REPORTS}}/clean.json" >&2
          echo "checks:openapi: clean.yaml must pass every rule" >&2
          exit 1
        fi
      - task: tool:spectral
        vars:
          RULESET: '{{.OPENAPI_FIXTURES}}/spectral.yaml'
          FILES: '{{.OPENAPI_FIXTURES}}/insecure.yaml'
          REPORT: '{{.REPORTS}}/insecure.json'
          EXPECT: findings
      - |
        jq -e 'any(.[]; .code == "operation-description") and any(.[]; .code == "owasp:api2:2023-write-restricted")' \
          "{{.REPORTS}}/insecure.json" > /dev/null || {
          echo "checks:openapi: insecure.yaml must be reported by both spectral:oas and the OWASP ruleset" >&2
          jq -c 'map(.code) | unique' "{{.REPORTS}}/insecure.json" >&2
          exit 1
        }
        echo "checks:openapi: clean.yaml passes; spectral:oas and OWASP both report insecure.yaml"
