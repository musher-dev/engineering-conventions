version: '3'

# The Rego rules: format, lint, type-check and unit-test
# engineering-conventions/checks/rego, and the shipped OpenAPI ruleset. The fixture-repo pass (every requirement
# proved against a miniature repository) runs under `cli:test`, because the
# CLI is what feeds a repository to conftest.

set: [errexit, nounset, pipefail]

vars:
  REGO_DIR: '{{.PRODUCT_DIR}}/checks/rego'
  INDEX: '{{.PRODUCT_DIR}}/checks/data/index.json'
  REGAL_CONFIG: .config/rego/regal.yaml
  COVERAGE_THRESHOLD: 80
  OPENAPI_RULESET: '{{.PRODUCT_DIR}}/checks/openapi/musher.spectral.yaml'
  OPENAPI_FIXTURES: '{{.PRODUCT_DIR}}/tests/fixtures/openapi'

tasks:
  checks:fmt:
    desc: Format the Rego rules in place with opa fmt.
    cmds:
      - opa fmt --write {{.REGO_DIR}}

  checks:fmt:check:
    desc: Fail if any Rego file is not opa fmt-formatted (lists the files).
    cmds:
      - opa fmt --fail --list {{.REGO_DIR}}

  checks:lint:
    desc: Lint the Rego rules with Regal (.config/rego/regal.yaml); warnings fail.
    cmds:
      - regal lint --config-file {{.REGAL_CONFIG}} --fail-level warning {{.REGO_DIR}}

  checks:check:
    desc: Parse and type-check the Rego rules against the generated index with opa check --strict.
    cmds:
      - opa check --strict {{.REGO_DIR}} {{.INDEX}}

  checks:test:
    desc: Run the Rego unit tests under conftest and opa; fail below {{.COVERAGE_THRESHOLD}}% coverage or on zero tests.
    cmds:
      # The tests under conftest's embedded OPA: consumers run the rules with
      # conftest, so this is what catches opa and conftest drifting apart
      # (.claude/rules/toolchain-pins.md) before a consumer does. It prints
      # each failing test by name.
      - conftest verify --no-color --policy {{.REGO_DIR}} --data {{.INDEX}}
      # The same tests under the pinned opa, in one pass that also measures
      # coverage. A failing test still fails the run and prints its name.
      # --fail-on-empty: without it `opa test` exits 0 when it finds no tests
      # at all, so a renamed test package or a broken glob would pass
      # silently. --coverage-runs= skips the extra annotation passes, which
      # only label uncovered lines in a report nothing here reads.
      - |
        report="$(mktemp)"
        trap 'rm -f "${report}"' EXIT
        opa test --fail-on-empty --coverage --coverage-runs= --threshold {{.COVERAGE_THRESHOLD}} \
          {{.REGO_DIR}} {{.INDEX}} > "${report}"
        coverage="$(opa eval --stdin-input --format raw 'input.coverage' < "${report}")"
        echo "Rego coverage: ${coverage}% (threshold {{.COVERAGE_THRESHOLD}}%)"

  checks:openapi:
    desc: Test the shipped Spectral ruleset; each musher-* rule fires once on trips.yaml, and nothing on clean.yaml.
    cmds:
      # The rules are warnings, so spectral exits 0 on both documents; a
      # non-zero exit is a broken ruleset or document, and fails the task.
      - |
        clean="$(spectral lint --quiet --format json --ruleset {{.OPENAPI_RULESET}} {{.OPENAPI_FIXTURES}}/clean.yaml)"
        if [[ "$(jq length <<< "${clean}")" != 0 ]]; then
          jq -r '.[] | "clean.yaml: \(.code) at \(.path | join("."))"' <<< "${clean}" >&2
          echo "checks:openapi: clean.yaml must pass every rule" >&2
          exit 1
        fi
      - |
        rules="$(yq -o json '.rules | keys' {{.OPENAPI_RULESET}} | jq -c 'map(select(startswith("musher-"))) | sort')"
        fired="$(spectral lint --quiet --format json --ruleset {{.OPENAPI_RULESET}} {{.OPENAPI_FIXTURES}}/trips.yaml \
          | jq -c 'map(.code) | sort')"
        if [[ "${rules}" != "${fired}" ]]; then
          echo "checks:openapi: trips.yaml must fire each musher-* rule exactly once and nothing else" >&2
          echo "  rules: ${rules}" >&2
          echo "  fired: ${fired}" >&2
          exit 1
        fi
        echo "checks:openapi: $(jq length <<< "${rules}") rules each fire once on trips.yaml; clean.yaml passes"
