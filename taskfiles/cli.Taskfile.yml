version: '3'

# CLI: the conventions CLI (engineering-conventions/src/conventions_tools),
# the authoring tool that generates the committed artifacts, checks
# invariants and runs a repository through the rules. Consumers never need it:
# everything it generates is committed, and the bundle excludes it. Its lint,
# type check and tests run through the ruff, basedpyright and pytest wrappers
# in taskfiles/tools/. cli:invariants and cli:classify compare against a git
# ref, which no file fingerprint covers, so they are never skipped.

set: [errexit, nounset, pipefail]

tasks:
  cli:sync:
    desc: Create the CLI's virtualenv from the committed uv.lock (fails if the lock is stale).
    cmds:
      - uv sync --project {{.PRODUCT_DIR}} --locked

  cli:lint:
    desc: Lint and format-check the CLI with ruff.
    cmds:
      - task: tool:ruff

  cli:lint:fix:
    desc: Fix what ruff can repair, and format the CLI, in place.
    cmds:
      - task: tool:ruff:fix

  cli:typecheck:
    desc: Type-check the CLI with basedpyright.
    cmds:
      - task: tool:basedpyright

  cli:test:
    desc: Run the CLI's pytest suite, which covers the content invariants and every fixture repo.
    cmds:
      - task: tool:pytest

  cli:invariants:
    desc: Check the content invariants, with IDs append-only against BASELINE (a git ref; default HEAD).
    vars:
      # CI passes the merge base (e.g. BASELINE=origin/main), so a PR that
      # renumbers or drops an ID fails against what main already published.
      BASELINE: '{{.BASELINE | default "HEAD"}}'
    cmds:
      - '{{.UV_RUN}} conventions invariants --baseline {{.BASELINE}}'

  cli:classify:
    desc: Fail when TITLE's commit type is below the change class the index.json diff against BASELINE implies.
    requires:
      vars: [BASELINE, TITLE]
    cmds:
      # TITLE is passed through the environment, never interpolated into the
      # command: a pull request title is untrusted input.
      - '{{.UV_RUN}} conventions classify --baseline "$BASELINE" --title "$TITLE"'
    env:
      BASELINE: '{{.BASELINE}}'
      TITLE: '{{.TITLE}}'
