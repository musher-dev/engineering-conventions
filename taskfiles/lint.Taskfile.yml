version: '3'

# Lint: every linter and format check over the repository, and the fixers
# beside them. `lint` and every lint:<x> task only report; a task that writes
# its fixes ends in `:fix`, and `lint:fix` runs them all. Each task runs a tool
# through its wrapper in taskfiles/tools/, which holds the binary, its config
# path and its file set. The Rego and Python checks belong to the checks and
# cli areas, and `lint` runs them too, with the prose lint.
#
# A lint:<x> task given files after `--` (task lint:md -- README.md), as the
# git hooks give them, checks only those files.

set: [errexit, nounset, pipefail]

tasks:
  lint:
    desc: Run every linter and format check, changing no file.
    cmds:
      - task: lint:md
      - task: lint:yaml
      - task: lint:toml
      - task: lint:spelling
      - task: lint:shell
      - task: lint:docker
      - task: lint:actions
      - task: lint:actions:security
      - task: prose:lint
      - task: checks:fmt:check
      - task: checks:lint
      - task: cli:lint

  lint:fix:
    desc: Run every fixer (Markdown, TOML, Rego formatting, ruff) in place; review the diff.
    cmds:
      - task: lint:md:fix
      - task: lint:toml:fix
      - task: checks:fmt:fix
      - task: cli:lint:fix

  lint:md:
    desc: Lint Markdown against .config/markdown/markdownlint.jsonc.
    cmds:
      - task: tool:markdownlint
        vars: {FILES: '{{.CLI_ARGS}}'}

  lint:md:fix:
    desc: Fix the Markdown issues markdownlint can repair, in place.
    cmds:
      - task: tool:markdownlint:fix
        vars: {FILES: '{{.CLI_ARGS}}'}

  lint:yaml:
    desc: Lint YAML against .config/yaml/yamllint.yaml (warnings fail).
    cmds:
      - task: tool:yamllint
        vars: {FILES: '{{.CLI_ARGS}}'}

  lint:toml:
    desc: Check TOML formatting against .config/toml/taplo.toml.
    cmds:
      - task: tool:taplo
        vars: {FILES: '{{.CLI_ARGS}}'}

  lint:toml:fix:
    desc: Format TOML in place with taplo.
    cmds:
      - task: tool:taplo:fix
        vars: {FILES: '{{.CLI_ARGS}}'}

  lint:spelling:
    desc: Spellcheck every file against .config/spelling/typos.toml.
    cmds:
      - task: tool:typos
        vars: {FILES: '{{.CLI_ARGS}}'}

  lint:shell:
    desc: Run ShellCheck on every shell script, following sourced libraries.
    cmds:
      - task: tool:shellcheck
        vars: {FILES: '{{.CLI_ARGS}}'}

  lint:docker:
    desc: Lint every Dockerfile with hadolint and .config/docker/hadolint.yaml (IMAGE-06).
    cmds:
      - task: tool:hadolint
        vars: {FILES: '{{.CLI_ARGS}}'}

  lint:actions:
    desc: Lint the workflows with actionlint (.config/actions/actionlint.yaml).
    cmds:
      - task: tool:actionlint

  lint:actions:security:
    desc: Audit workflows, composite actions and Dependabot config with zizmor at GHA-33's floor.
    cmds:
      - task: tool:zizmor
