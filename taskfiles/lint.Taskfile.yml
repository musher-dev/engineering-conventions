version: '3'

# Repository-level lint and secret scan. Every command names its config file
# explicitly with the tool's own flag; default discovery is never relied upon,
# which is what keeps the configs in .config/ instead of at the repo root.
# File lists come from LIST_FILES (.github/scripts/list-files.sh), so every
# tool sees the same set: tracked plus untracked-but-not-ignored.

set: [errexit, nounset, pipefail]

tasks:
  lint:
    desc: Lint Markdown, YAML, TOML, spelling, shell scripts and Dockerfiles.
    cmds:
      - task: lint:md
      - task: lint:yaml
      - task: lint:toml
      - task: lint:spelling
      - task: lint:shell
      - task: lint:docker

  lint:md:
    desc: Lint Markdown against .config/markdown/markdownlint.jsonc.
    cmds:
      - '{{.LIST_FILES}} {{.MD_PATHSPEC}} | xargs -0 -r markdownlint-cli2 --config {{.MD_CONFIG}}'

  lint:md:fix:
    desc: Auto-fix the Markdown issues markdownlint can repair (review the diff).
    cmds:
      - '{{.LIST_FILES}} {{.MD_PATHSPEC}} | xargs -0 -r markdownlint-cli2 --config {{.MD_CONFIG}} --fix'

  lint:yaml:
    desc: Lint YAML against .config/yaml/yamllint.yaml (warnings fail).
    cmds:
      - '{{.LIST_FILES}} {{.YAML_PATHSPEC}} | xargs -0 -r yamllint -c {{.YAML_CONFIG}} --strict'

  lint:toml:
    desc: Check TOML formatting against .config/toml/taplo.toml.
    cmds:
      - '{{.LIST_FILES}} {{.TOML_PATHSPEC}} | xargs -0 -r taplo fmt --config {{.TOML_CONFIG}} --check'

  lint:toml:fix:
    desc: Format TOML files in place with taplo (review the diff).
    cmds:
      - '{{.LIST_FILES}} {{.TOML_PATHSPEC}} | xargs -0 -r taplo fmt --config {{.TOML_CONFIG}}'

  lint:spelling:
    desc: Spellcheck every file against .config/spelling/typos.toml.
    cmds:
      - typos --config {{.TYPOS_CONFIG}}

  lint:shell:
    desc: Run ShellCheck on every shell script, following sourced libraries.
    cmds:
      # bin/ holds the launcher and the jq program it renders with (report.jq).
      - >-
        {{.LIST_FILES}} '**/*.sh' 'engineering-conventions/bin/*' ':!:engineering-conventions/bin/*.jq'
        | xargs -0 -r shellcheck -x -P SCRIPTDIR

  lint:docker:
    desc: Lint every Dockerfile with hadolint and .config/docker/hadolint.yaml (IMAGE-06).
    cmds:
      - '{{.LIST_FILES}} {{.DOCKERFILE_PATHSPEC}} | xargs -0 -r hadolint --config {{.HADOLINT_CONFIG}}'

  lint:actions:
    desc: Lint the workflows with actionlint (.config/actions/actionlint.yaml).
    cmds:
      - actionlint -config-file {{.ACTIONLINT_CONFIG}}

  lint:actions:security:
    desc: Audit workflows, composite actions and Dependabot config with zizmor at GHA-33's floor.
    cmds:
      # Online audits (impostor commits, stale version comments, known-vulnerable
      # actions) run when GH_TOKEN is set, as in CI; locally they stay offline.
      # Explicit files rather than `zizmor .`: a directory walk would also
      # collect the deliberately non-conforming fixture repos under tests/.
      - >-
        {{.LIST_FILES}} '.github/workflows/*.yml' '.github/workflows/*.yaml'
        '.github/actions/*/action.yml' '.github/actions/*/action.yaml' '.github/dependabot.yml'
        | xargs -0 -r zizmor --config {{.ZIZMOR_CONFIG}} {{if not .GH_TOKEN}}--offline {{end}}
        --min-severity medium --persona regular

  secrets:scan:
    desc: Scan the git history for secrets with gitleaks (.config/security/gitleaks.toml).
    cmds:
      - gitleaks git --redact --no-banner --config {{.GITLEAKS_CONFIG}} .
