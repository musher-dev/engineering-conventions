version: '3'

# Repo-governance tasks. These wrap the `repo` CLI installed from .repo/
# by the devcontainer bootstrap (uv tool install ./.repo).
# See .repo/README.md for what each policy enforces and why.

tasks:
  check:
    desc: Run every repo-structure policy (config, layout, paths, env, ports, hooks, rulesets, toolchain, comments).
    cmds:
      - repo check

  check:config:
    desc: Verify .config/ layout, the README index, and no shadowing root config.
    cmds:
      - repo config check

  check:ports:
    desc: Verify the port table, forwardPorts, and compose published ports agree.
    cmds:
      - repo ports check

  check:layout:
    desc: Verify the root holds no product content and every product path agrees with .repo/layout.toml.
    cmds:
      - repo layout check

  check:paths:
    desc: Verify every configured glob, directory and Taskfile path var still resolves.
    cmds:
      - repo paths check

  check:env:
    desc: Verify every env.schema.yaml has the shared shape.
    cmds:
      - repo env check

  test:
    desc: Run the governance policies' pytest suite.
    cmds:
      - uv run --project .repo --group dev pytest .repo/tests

  check:hooks:
    desc: Verify every lefthook job has a CI counterpart and vice versa.
    cmds:
      - repo hooks check

  install:
    desc: (Re)install the `repo` CLI from .repo/ into the current environment.
    cmds:
      # --reinstall: uv reuses the cached build of an unchanged version otherwise,
      # so an edited policy would never take effect.
      - uv tool install --force --reinstall ./.repo
