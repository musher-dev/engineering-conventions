version: '3'

# Secrets: the gitleaks scans, over the whole history and over the staged
# changes the pre-commit hook is about to commit. Both run through
# taskfiles/tools/gitleaks.Taskfile.yml and are never skipped.

set: [errexit, nounset, pipefail]

tasks:
  secrets:scan:
    desc: Scan the git history for secrets with gitleaks (.config/security/gitleaks.toml).
    cmds:
      - task: tool:gitleaks

  secrets:scan:staged:
    desc: Scan the staged changes for secrets with gitleaks, as the pre-commit hook does.
    cmds:
      - task: tool:gitleaks:staged
