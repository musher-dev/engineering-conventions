version: '3'

# check-jsonschema: how files are validated against JSON Schemas. The binary
# and its flags are written here and nowhere else (TASK-26); the schemas area
# calls it, naming each schema and the files it governs. The metaschema check
# has a fixed file set and is skipped while it is unchanged since it last
# passed; the other two take their files from the caller, so the schemas area
# fingerprints them as a whole instead.

set: [errexit, nounset, pipefail]

tasks:
  tool:check-jsonschema:metaschema:
    desc: Check every JSON Schema in checks/schemas, the vendored ones included, against its metaschema.
    method: checksum
    sources:
      - engineering-conventions/checks/schemas/**/*.json
      - .config/mise/mise.lock
      - Taskfile.yml
      - taskfiles/tools/check-jsonschema.Taskfile.yml
    cmds:
      - check-jsonschema --check-metaschema {{.SCHEMA_DIR}}/*.schema.json {{.SCHEMA_DIR}}/vendor/*/*.json

  tool:check-jsonschema:files:
    desc: Validate the files PATHSPEC matches against SCHEMA from checks/schemas, read through yq.
    silent: true
    label: tool:check-jsonschema:files:{{.SCHEMA}}
    requires:
      vars: [SCHEMA, PATHSPEC]
    vars:
      # '--front-matter=extract' for Markdown, '-p toml' for the TOML
      # declarations; empty for plain YAML.
      YQ_FLAGS: '{{.YQ_FLAGS | default ""}}'
      SCHEMA_FILE: '{{.SCHEMA_DIR}}/{{.SCHEMA}}.schema.json'
    cmds:
      - echo "Validating files against {{.SCHEMA_FILE}}"
      # Through yq to JSON first, so YAML typing (a bare date becomes a string)
      # matches what the conventions CLI's loader sees, rather than
      # check-jsonschema's own YAML loader. yq rejects an unquoted TOML date,
      # which the declarations never hold (decision 0011). The JSON copies
      # mirror the source paths, so an error still names the file to fix. An
      # empty match fails: a mistyped pathspec must not turn the gate into a
      # silent pass.
      - |
        out="$(mktemp -d)"
        trap 'rm -rf "${out}"' EXIT
        {{.LIST_FILES}} {{.PATHSPEC}} | tr '\0' '\n' | while IFS= read -r file; do
          mkdir -p "${out}/$(dirname "${file}")"
          yq {{.YQ_FLAGS}} -o=json '.' "${file}" > "${out}/${file}.json" || exit 1
        done
        if [[ -z "$(ls -A "${out}")" ]]; then
          echo "check-jsonschema: nothing matches {{.PATHSPEC}} for {{.SCHEMA_FILE}}" >&2
          exit 1
        fi
        cd "${out}"
        find . -name '*.json' | LC_ALL=C sort | xargs check-jsonschema \
          --schemafile {{.SCHEMA_FILE}}

  tool:check-jsonschema:builtin:
    desc: Validate the files PATHSPEC matches against check-jsonschema's built-in SCHEMA.
    silent: true
    label: tool:check-jsonschema:builtin:{{.SCHEMA}}
    requires:
      vars: [SCHEMA, PATHSPEC]
    cmds:
      - echo "Validating files against the {{.SCHEMA}} schema"
      - '{{.LIST_FILES}} {{.PATHSPEC}} | xargs -0 -r check-jsonschema --builtin-schema {{.SCHEMA}}'
